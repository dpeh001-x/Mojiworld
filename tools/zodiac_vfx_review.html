<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Lives in tools/ but reads art from the repo root — resolve every relative
     URL (Sprites/...) against the root so the move cost no path rewrites. -->
<base href="../">
<title>Zodiac VFX Review — Mojiworld</title>
<style>
  :root { --bg:#0e0b1a; --panel:#181329; --edge:#2e2547; --ink:#e8e2f6; --dim:#9a8fc0;
          --gold:#ffd870; --keep:#4caf72; --edit:#e6a23c; --regen:#e05a6a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(14,11,26,0.96);
           border-bottom:1px solid var(--edge); padding:14px 20px; backdrop-filter:blur(6px); }
  header h1 { margin:0 0 4px; font-size:19px; color:var(--gold); }
  header p { margin:0; color:var(--dim); font-size:12.5px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .bar button, .bar label.tgl { background:var(--panel); color:var(--ink); border:1px solid var(--edge);
           border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer; }
  .bar button:hover { border-color:var(--gold); }
  .counts span { margin-right:12px; font-size:12px; }
  .c-keep{color:var(--keep)} .c-edit{color:var(--edit)} .c-regen{color:var(--regen)}
  main { padding:20px; max-width:1400px; margin:0 auto; }
  section { margin-bottom:34px; }
  section > h2 { font-size:15px; color:var(--gold); border-bottom:1px solid var(--edge);
                padding-bottom:6px; margin:0 0 4px; }
  section > .sub { color:var(--dim); font-size:12px; margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--edge); border-radius:12px; overflow:hidden;
          display:flex; flex-direction:column; transition:border-color .15s; }
  .card.s-keep { border-color:var(--keep); }
  .card.s-edit { border-color:var(--edit); }
  .card.s-regen { border-color:var(--regen); box-shadow:0 0 0 1px var(--regen) inset; }
  .thumb { height:170px; display:flex; align-items:center; justify-content:center; position:relative;
           background:#100c1e; }
  .thumb.checker { background-image:
      linear-gradient(45deg,#241d3c 25%,transparent 25%),
      linear-gradient(-45deg,#241d3c 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#241d3c 75%),
      linear-gradient(-45deg,transparent 75%,#241d3c 75%);
      background-size:22px 22px; background-position:0 0,0 11px,11px -11px,-11px 0; }
  .thumb img { max-width:92%; max-height:92%; image-rendering:auto; }
  .frametag { position:absolute; bottom:5px; right:7px; font-size:10px; color:var(--dim);
              background:rgba(0,0,0,0.5); padding:1px 6px; border-radius:6px; }
  .meta { padding:9px 11px; border-top:1px solid var(--edge); }
  .meta .name { font-weight:600; font-size:13px; }
  .meta .path { color:var(--dim); font-size:10.5px; word-break:break-all; margin-top:2px; }
  .status { display:flex; gap:5px; margin-top:9px; }
  .status button { flex:1; border:1px solid var(--edge); background:#120e22; color:var(--dim);
                   border-radius:7px; padding:5px 0; font-size:11px; cursor:pointer; }
  .status button.on-keep { background:var(--keep); color:#06210f; border-color:var(--keep); font-weight:700; }
  .status button.on-edit { background:var(--edit); color:#231602; border-color:var(--edit); font-weight:700; }
  .status button.on-regen{ background:var(--regen);color:#2a0409; border-color:var(--regen);font-weight:700; }
  .meta textarea { width:100%; margin-top:8px; background:#120e22; color:var(--ink);
                   border:1px solid var(--edge); border-radius:7px; padding:6px; font-size:12px;
                   resize:vertical; min-height:34px; font-family:inherit; }
  #exportOut { white-space:pre-wrap; background:#120e22; border:1px solid var(--edge); border-radius:10px;
               padding:14px; margin-top:14px; font:12px/1.5 ui-monospace,Menlo,monospace; display:none; }
</style>
</head>
<body>
<header>
  <h1>★ Zodiac VFX Review</h1>
  <p>Every zodiac-related visual asset in the game. Mark each <b>Keep</b> / <b>Edit</b> / <b>Regenerate</b> and add notes — marks save in your browser. Hit <b>Export marks</b> to hand the list back for edits.</p>
  <div class="bar">
    <label class="tgl"><input type="checkbox" id="chkChecker" checked> Checkerboard bg</label>
    <label class="tgl"><input type="checkbox" id="chkAnim" checked> Animate frames</label>
    <button id="btnFilter">Show flagged only</button>
    <button id="btnExport">Export marks ▾</button>
    <button id="btnReset">Clear all marks</button>
    <span class="counts" id="counts"></span>
  </div>
  <div id="exportOut"></div>
</header>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LS = 'lx_zodiac_vfx_marks_v1';
let marks = {}; try { marks = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) {}
const save = () => localStorage.setItem(LS, JSON.stringify(marks));
const main = document.getElementById('main');
const timers = [];
let filterFlagged = false;

function card(it) {
  const el = document.createElement('div');
  el.className = 'card'; el.dataset.id = it.id;
  const st = (marks[it.id] && marks[it.id].status) || '';
  if (st) el.classList.add('s-' + st);
  const th = document.createElement('div');
  th.className = 'thumb' + (document.getElementById('chkChecker').checked ? ' checker' : '');
  const img = document.createElement('img');
  img.src = it.frames[0]; img.loading = 'lazy'; img.alt = it.name;
  img.onerror = () => { th.style.color = '#e05a6a'; th.textContent = 'missing'; };
  th.appendChild(img);
  if (it.frames.length > 1) {
    let i = 0;
    const tag = document.createElement('div'); tag.className = 'frametag';
    tag.textContent = it.frames.length + ' frames'; th.appendChild(tag);
    const t = setInterval(() => {
      if (!document.getElementById('chkAnim').checked) return;
      i = (i + 1) % it.frames.length; img.src = it.frames[i];
    }, 110);
    timers.push(t);
  }
  el.appendChild(th);
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = '<div class="name">' + it.name + '</div>'
    + '<div class="path">' + it.desc + '<br>' + it.frames[0].replace(/_0(\.webp|\.png)$/, '_*$1') + '</div>';
  const stat = document.createElement('div'); stat.className = 'status';
  [['keep', 'Keep'], ['edit', 'Edit'], ['regen', 'Regen']].forEach(([k, lbl]) => {
    const b = document.createElement('button'); b.textContent = lbl;
    if (st === k) b.className = 'on-' + k;
    b.onclick = () => {
      marks[it.id] = marks[it.id] || {};
      marks[it.id].status = (marks[it.id].status === k) ? '' : k;
      marks[it.id].name = it.name; marks[it.id].path = it.frames[0];
      save(); render();
    };
    stat.appendChild(b);
  });
  meta.appendChild(stat);
  const ta = document.createElement('textarea');
  ta.placeholder = 'notes…'; ta.value = (marks[it.id] && marks[it.id].note) || '';
  ta.oninput = () => { marks[it.id] = marks[it.id] || {}; marks[it.id].note = ta.value;
    marks[it.id].name = it.name; marks[it.id].path = it.frames[0]; save(); };
  meta.appendChild(ta);
  el.appendChild(meta);
  return el;
}

function render() {
  timers.forEach(clearInterval); timers.length = 0;
  main.innerHTML = '';
  for (const sec of DATA.sections) {
    const items = sec.items.filter(it => !filterFlagged
      || (marks[it.id] && (marks[it.id].status || marks[it.id].note)));
    if (!items.length) continue;
    const s = document.createElement('section');
    s.innerHTML = '<h2>' + sec.title + ' <span style="color:#9a8fc0;font-weight:400">(' + sec.items.length + ')</span></h2><p class="sub">' + sec.sub + '</p>';
    const g = document.createElement('div'); g.className = 'grid';
    items.forEach(it => g.appendChild(card(it)));
    s.appendChild(g); main.appendChild(s);
  }
  const c = { keep: 0, edit: 0, regen: 0 };
  Object.values(marks).forEach(m => { if (m.status) c[m.status]++; });
  document.getElementById('counts').innerHTML =
    '<span class="c-keep">✅ ' + c.keep + '</span><span class="c-edit">✏️ ' + c.edit + '</span><span class="c-regen">🔄 ' + c.regen + '</span>';
}

document.getElementById('chkChecker').onchange = render;
document.getElementById('btnFilter').onclick = (e) => {
  filterFlagged = !filterFlagged;
  e.target.textContent = filterFlagged ? 'Show all' : 'Show flagged only'; render();
};
document.getElementById('btnReset').onclick = () => {
  if (confirm('Clear all marks?')) { marks = {}; save(); render();
    document.getElementById('exportOut').style.display = 'none'; }
};
document.getElementById('btnExport').onclick = () => {
  const out = document.getElementById('exportOut');
  const order = { regen: 0, edit: 1, keep: 2 };
  const rows = Object.entries(marks).filter(([, m]) => m.status || m.note)
    .sort((a, b) => (order[a[1].status] ?? 3) - (order[b[1].status] ?? 3));
  if (!rows.length) { out.textContent = 'No marks yet.'; out.style.display = 'block'; return; }
  const ico = { keep: '✅ KEEP ', edit: '✏️ EDIT ', regen: '🔄 REGEN' };
  out.textContent = 'ZODIAC VFX MARK-UP\n==================\n\n' + rows.map(([id, m]) =>
    (ico[m.status] || '·      ') + '  ' + (m.name || id)
    + '\n         ' + (m.path || '')
    + (m.note ? '\n         → ' + m.note : '')).join('\n\n');
  out.style.display = 'block'; out.scrollIntoView({ behavior: 'smooth' });
};
render();
</script>
</body>
</html>
