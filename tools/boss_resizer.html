<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Boss Animation Resizer — Mojiworld</title>
<!-- Tool pages live in tools/ but read art from the repo root; the base tag is
     how zodiac_vfx_review keeps its root-relative Sprites/ URLs working. -->
<base href="../" />
<style>
  :root{
    --bg:#0d0a14; --panel:#151022; --panel2:#1b1430; --line:#2c2340;
    --ink:#e9e2ff; --dim:#9d92bb; --dim2:#6f658c;
    --accent:#c08cff; --accent2:#7a2ad0; --ok:#7ddba0; --warn:#ffcc66; --bad:#ff7a7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       display:grid;grid-template-columns:236px 1fr;overflow:hidden}
  aside,main{height:100vh;overflow:auto}
  aside{background:var(--panel);border-right:1px solid var(--line)}
  h1{font-size:14px;margin:0}
  .head{padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
  .sub{color:var(--dim);font-size:11px;margin-top:3px}
  .badge{background:#123524;color:var(--ok);border:1px solid #2a5c40;border-radius:10px;padding:1px 8px;font-weight:600;font-size:11px}
  input[type=search],input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 8px;font:inherit;width:100%}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
         border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent2);color:#fff}
  button.primary{background:var(--accent2);border-color:#9b57ff;color:#fff;font-weight:600}
  button.ghost{background:transparent}
  button.mini{padding:3px 7px;font-size:11px}
  .ent{padding:7px 14px;border-bottom:1px solid #201936;cursor:pointer;display:flex;
       justify-content:space-between;align-items:center;gap:8px}
  .ent:hover{background:var(--panel2)}
  .ent.sel{background:#241a3e;box-shadow:inset 3px 0 0 var(--accent)}
  .ent .n{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ent .g{font-size:10px;color:var(--dim2)}
  .pill{font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600;white-space:nowrap}
  .p-ok{background:#12291c;color:var(--ok)} .p-warn{background:#33280e;color:var(--warn)}
  .p-bad{background:#3a1418;color:var(--bad)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;
       border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:4}
  .bar .title{font-weight:600}
  label.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--dim);cursor:pointer}
  /* ---- the contact sheet: one card per animation ---- */
  #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
         gap:12px;padding:16px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px}
  .card.off{opacity:.55}
  .card.dragging{border-color:var(--accent)}
  .card.dragging canvas{box-shadow:0 0 0 1px var(--accent2) inset}
  .card canvas{width:100%;height:250px;display:block;border-radius:6px;cursor:ns-resize;touch-action:none;
               background:linear-gradient(#171029,#0f0b1a)}
  .card .nm{font-size:12px;font-weight:600;margin:7px 0 1px;display:flex;
            justify-content:space-between;align-items:baseline;gap:6px}
  .card .nm em{font-style:normal;font-size:10px;color:var(--dim2);font-weight:500}
  .card .vs{font-size:11px;margin-bottom:6px}
  .card .ctl{display:flex;gap:5px;align-items:center;margin-bottom:5px}
  .card .ctl:last-child{margin-bottom:0}
  .card .ctl input{padding:3px 6px;text-align:center}
  .card .ctl .axis{color:var(--dim2);font-size:13px;width:12px;text-align:center;flex:none}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:4px 10px;font-size:12px}
  .seg button.on{background:var(--accent2);color:#fff}
  .foot{padding:0 16px 20px}
  textarea{width:100%;height:80px;background:#0a0714;border:1px solid var(--line);color:#cbbdf0;
           border-radius:7px;padding:8px;font:11px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
  .note{font-size:11px;color:var(--dim);line-height:1.5;margin-top:8px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#241a3e;
         border:1px solid var(--accent2);color:#fff;padding:9px 16px;border-radius:8px;
         opacity:0;pointer-events:none;transition:opacity .18s;z-index:99;font-size:12px}
  #toast.on{opacity:1}
  .empty{padding:50px 20px;text-align:center;color:var(--dim2);font-size:12px}
</style>
</head>
<body>
<aside id="list">
  <div class="head">
    <h1>Boss Animation Resizer</h1>
    <div class="sub"><span class="badge" id="build">build v0.30.79</span> &middot; drag to resize, or to nudge up/down</div>
    <div class="sub" style="margin-top:7px"><input type="search" id="q" placeholder="search bosses…" /></div>
  </div>
  <div id="ents"></div>
</aside>

<main>
  <div class="bar">
    <span class="title" id="who">Pick a boss</span>
    <span id="summary" class="sub" style="margin:0"></span>
    <span style="flex:1"></span>
    <span class="sub" style="margin:0">drag&nbsp;=</span>
    <span class="seg" id="mode">
      <button data-m="size" class="on" title="Dragging a sprite changes its size (hold Shift for up/down)">size</button>
      <button data-m="move" title="Dragging a sprite moves it up or down (hold Shift for size)">up/down</button>
    </span>
    <label class="chk"><input type="checkbox" id="play" checked />play</label>
    <label class="chk"><input type="checkbox" id="idleover" checked />idle overlay</label>
    <label class="chk"><input type="checkbox" id="before" />show original</label>
    <button id="matchall" class="ghost" title="Set every animation to the idle height">match all to idle</button>
    <button id="revert" class="ghost" title="Undo every change to this boss">revert</button>
    <button id="copy" class="primary" title="Copy the patch — paste it in chat to have it hardbaked">&#128203; Copy patch</button>
  </div>
  <div id="cards"><div class="empty">Pick a boss on the left to see all of its animations.</div></div>
  <div class="foot" id="foot" style="display:none">
    <textarea id="patch" readonly></textarea>
    <div class="note" id="footnote"></div>
  </div>
</main>
<div id="toast"></div>

<script src="data/boss_resize_manifest.js"></script>
<script src="data/anim_calib.js"></script>
<script src="tools/boss_resizer.js"></script>
</body>
</html>
