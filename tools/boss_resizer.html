<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Boss Frame Resizer — Mojiworld</title>
<!-- Tool pages live in tools/ but read art from the repo root; the base tag is
     how zodiac_vfx_review keeps its root-relative Sprites/ URLs working. -->
<base href="../" />
<style>
  :root{
    --bg:#0d0a14; --panel:#151022; --panel2:#1b1430; --line:#2c2340;
    --ink:#e9e2ff; --dim:#9d92bb; --dim2:#6f658c;
    --accent:#c08cff; --accent2:#7a2ad0; --ok:#7ddba0; --warn:#ffcc66; --bad:#ff7a7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       display:grid;grid-template-columns:250px 1fr 330px;overflow:hidden}
  aside,main{height:100vh;overflow:auto}
  aside{background:var(--panel);border-right:1px solid var(--line)}
  #ctrl{border-right:0;border-left:1px solid var(--line)}
  h1{font-size:14px;margin:0;letter-spacing:.2px}
  .head{padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
  .sub{color:var(--dim);font-size:11px;margin-top:3px}
  .badge{background:#123524;color:var(--ok);border:1px solid #2a5c40;border-radius:10px;
         padding:1px 8px;font-weight:600;font-size:11px}
  input[type=search],input[type=number],select{
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 8px;font:inherit;width:100%}
  input[type=number]{padding:3px 6px}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
         border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent2);color:#fff}
  button.primary{background:var(--accent2);border-color:#9b57ff;color:#fff;font-weight:600}
  button.ghost{background:transparent}
  button:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:6px;align-items:center}
  .wrap{display:flex;gap:6px;flex-wrap:wrap}
  /* ---- entity list ---- */
  .ent{padding:7px 14px;border-bottom:1px solid #201936;cursor:pointer;display:flex;
       justify-content:space-between;align-items:center;gap:8px}
  .ent:hover{background:var(--panel2)}
  .ent.sel{background:#241a3e;box-shadow:inset 3px 0 0 var(--accent)}
  .ent .n{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ent .g{font-size:10px;color:var(--dim2)}
  .pill{font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600;white-space:nowrap}
  .p-ok{background:#12291c;color:var(--ok)}
  .p-warn{background:#33280e;color:var(--warn)}
  .p-bad{background:#3a1418;color:var(--bad)}
  /* ---- stage ---- */
  #stagewrap{padding:14px;display:flex;flex-direction:column;gap:10px}
  #stage{background:
      linear-gradient(#171029,#0f0b1a);
      border:1px solid var(--line);border-radius:10px;display:block;width:100%;cursor:crosshair}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
       padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);
       position:sticky;top:0;z-index:4}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:4px 9px;font-size:12px}
  .seg button.on{background:var(--accent2);color:#fff}
  label.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--dim);cursor:pointer}
  /* ---- frame strip ---- */
  #strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .fr{flex:0 0 84px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
      padding:5px;text-align:center;cursor:pointer}
  .fr.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent2)}
  .fr canvas{width:100%;height:62px;display:block;background:#100c1c;border-radius:4px}
  .fr .t{font-size:10px;color:var(--dim);margin-top:3px}
  .fr .v{font-size:11px;font-weight:600}
  .fr input{width:100%;margin-top:3px;text-align:center;font-size:11px}
  /* ---- right panel ---- */
  .sec{padding:12px 14px;border-bottom:1px solid var(--line)}
  .sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim2);margin:0 0 8px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .kv b{font-weight:600}
  .note{font-size:11px;color:var(--dim);line-height:1.45}
  .warnbox{background:#33280e;border:1px solid #6b5416;color:#ffdf9b;border-radius:7px;
           padding:8px 10px;font-size:11px;line-height:1.45}
  .okbox{background:#12291c;border:1px solid #2a5c40;color:#b6f0cb;border-radius:7px;
         padding:8px 10px;font-size:11px;line-height:1.45}
  textarea{width:100%;height:110px;background:#0a0714;border:1px solid var(--line);color:#cbbdf0;
           border-radius:7px;padding:8px;font:11px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#241a3e;
         border:1px solid var(--accent2);color:#fff;padding:9px 16px;border-radius:8px;
         opacity:0;pointer-events:none;transition:opacity .18s;z-index:99;font-size:12px}
  #toast.on{opacity:1}
  .empty{padding:40px 20px;text-align:center;color:var(--dim2);font-size:12px}
</style>
</head>
<body>
<aside id="list">
  <div class="head">
    <h1>Boss Frame Resizer</h1>
    <div class="sub"><span class="badge" id="build">build v0.30.67</span></div>
    <div class="sub" style="margin-top:7px"><input type="search" id="q" placeholder="search bosses…" /></div>
  </div>
  <div id="ents"></div>
</aside>

<main>
  <div class="bar">
    <span class="seg" id="states"></span>
    <span class="seg" id="mode">
      <button data-m="content" class="on" title="Full drawn extent, alpha &gt; 16 — includes a reared weapon">content</button>
      <button data-m="solid" title="Opaque core only, alpha &gt; 235">solid</button>
      <button data-m="band" title="Only rows inside the band you drag on the stage — measure the torso and ignore the weapon">band</button>
    </span>
    <label class="chk"><input type="checkbox" id="applyfs" checked />apply fs</label>
    <label class="chk"><input type="checkbox" id="play" checked />play</label>
    <label class="chk"><input type="checkbox" id="ghost" checked />reference line</label>
    <span style="flex:1"></span>
    <button id="reset" class="ghost" title="Clear every fs for this state">reset state</button>
    <button id="copy" class="primary" title="Copy the patch — paste it in chat to have it hardbaked">&#128203; Copy patch</button>
  </div>
  <div id="stagewrap">
    <canvas id="stage" width="900" height="460"></canvas>
    <div id="strip"></div>
  </div>
</main>

<aside id="ctrl">
  <div class="empty" id="ctrlEmpty">Pick a boss on the left.</div>
  <div id="ctrlBody" style="display:none"></div>
</aside>
<div id="toast"></div>

<script src="data/boss_resize_manifest.js"></script>
<script src="data/anim_calib.js"></script>
<script src="tools/boss_resizer.js"></script>
</body>
</html>
