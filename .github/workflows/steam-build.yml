# Builds the Steam depot payloads:
#   - Windows: steam/release/win-unpacked/  (launch: Mojiworld.exe)
#   - Linux:   steam/release/linux-unpacked/ (launch: mojiworld — Steam Deck native)
# Download the artifacts, then upload with steamcmd + steam/steam_upload/*.vdf.
#
# Repo variables (Settings > Secrets and variables > Actions > Variables):
#   STEAM_APP_ID   — your real Steam App ID (falls back to 480/Spacewar for QA)
#   MOJI_RELAY_URL — wss:// relay baked into the build (omit = co-op off, solo fine)
name: Build Steam depots (Mojiworld.exe)

on:
  workflow_dispatch:
  push:
    tags: ['steam-v*']
    branches: [main]
    paths: ['steam/**', '.github/workflows/steam-build.yml']

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash, working-directory: steam } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: steam/package-lock.json }
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Bake App ID + relay
        run: |
          echo "${{ vars.STEAM_APP_ID || 480 }}" > steam_appid.txt
          if [ -n "${{ vars.MOJI_RELAY_URL }}" ]; then
            printf '{"relay":"%s"}' "${{ vars.MOJI_RELAY_URL }}" > relay.config.json
          fi
          cat steam_appid.txt
      - name: Build (win-unpacked)
        run: npm run dist:steamwin
      # ----- Code signing (Azure Trusted Signing) -------------------------
      # Runs ONLY when the AZURE_* secrets are configured (Settings > Secrets
      # and variables > Actions > Secrets) — until then the depot ships
      # unsigned exactly as before, so this step never blocks a build.
      # Why: Smart-App-Control machines block unsigned exes with no user
      # override (docs/guides/CODE_SIGNING.md has the full setup walkthrough).
      - name: Sign Mojiworld.exe (Azure Trusted Signing)
        if: ${{ secrets.AZURE_TENANT_ID != '' }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}/steam/release/win-unpacked
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signature
        if: ${{ secrets.AZURE_TENANT_ID != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "release/win-unpacked/Mojiworld.exe"
          $sig | Format-List Status, StatusMessage
          if ($sig.Status -ne 'Valid') { Write-Error "signature invalid: $($sig.Status)"; exit 1 }
      - name: Verify Mojiworld.exe
        run: |
          test -f "release/win-unpacked/Mojiworld.exe" || { echo "::error::Mojiworld.exe missing"; ls -la release/win-unpacked || true; exit 1; }
          ls -la release/win-unpacked | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: mojiworld-windows-depot
          path: steam/release/win-unpacked/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash, working-directory: steam } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: steam/package-lock.json }
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Bake App ID + relay
        run: |
          echo "${{ vars.STEAM_APP_ID || 480 }}" > steam_appid.txt
          if [ -n "${{ vars.MOJI_RELAY_URL }}" ]; then
            printf '{"relay":"%s"}' "${{ vars.MOJI_RELAY_URL }}" > relay.config.json
          fi
      - name: Build (linux-unpacked)
        run: npm run dist:steamdeck
      - name: Verify executable
        run: |
          test -x "release/linux-unpacked/mojiworld" || { echo "::error::mojiworld binary missing"; ls -la release/linux-unpacked || true; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mojiworld-linux-depot
          path: steam/release/linux-unpacked/
          if-no-files-found: error
