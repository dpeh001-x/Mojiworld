name: Deploy game to GitHub Pages

# Publishes the game to GitHub Pages, intended to live on its OWN subdomain
# (e.g. play.moji-studios.com) so it never touches the studio site on the apex
# moji-studios.com (which is hosted on Cloudflare Pages). On a custom domain the
# subdomain ROOT serves the game directly -> https://play.moji-studios.com/.
#
# Heavy art (Sprites/ audio/ backgrounds/, ~1.3GB) is NOT bundled — it streams
# from jsDelivr over this repo, pinned to the commit SHA. Keeps the artifact tiny.
#
# One-time setup outside this file (see DEPLOY.md):
#   - Cloudflare DNS: CNAME  play -> dpeh001-x.github.io   (DNS-only / grey cloud)
#   - repo Settings -> Pages -> Source = "GitHub Actions"
#   - Actions *variable* GAME_DOMAIN = play.moji-studios.com   (enables custom domain)
#   - Actions *variable* MP_WSS_URL  = wss://<your-mp-host>    (enables live multiplayer)
# Until GAME_DOMAIN is set, the build claims no custom domain and serves at the
# default github.io URL — safe to run anytime.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        env:
          GAME_DOMAIN: ${{ vars.GAME_DOMAIN }}
          MP_WSS_URL: ${{ vars.MP_WSS_URL }}
        run: |
          set -euo pipefail
          mkdir -p _site

          # Bundle the game HTML + the data/ runtime tables (anim_calib.js,
          # mob_offsets.js, etc.) + CHANGELOG at the site ROOT (subdomain root ==
          # the game). The heavy art (Sprites/ audio/ backgrounds/, ~1.3GB) is
          # EXCLUDED and streamed from a CDN (rewritten below) so the artifact
          # stays well under Pages' 1GB limit. Drop VCS/dev/server/backup/docs —
          # not loaded by the game, and internal design docs shouldn't be
          # published. steam/ is PARTLY kept: steam/higgsfield/cinematics/*.mp4
          # ARE runtime (the game <video>-plays 15 of them) and are too large for
          # jsDelivr's 20MB/file cap, so they ship in the artifact; the Steam
          # store art, electron build resources and upload VDFs do not.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude 'Sprites' \
            --exclude 'audio' \
            --exclude 'backgrounds' \
            --exclude 'mp' \
            --exclude 'server' \
            --exclude 'scripts' \
            --exclude 'tools' \
            --exclude '*.md' \
            --exclude '*.bak' \
            --exclude '*recover*' \
            --exclude '*RECOVER*' \
            --exclude '*rescue*' \
            --exclude 'monster_animator*' \
            --exclude 'steam/assets' \
            --exclude 'steam/build' \
            --exclude 'steam/steam_upload' \
            --exclude 'steam/controller_config' \
            --exclude 'Mojiworld.exe' \
            --exclude 'Mojiworld.cmd' \
            --exclude 'serve.js' \
            --exclude 'serve.bat'

          # Serve the game at the site root (index.html == the game).
          cp mojiworld_game.html _site/index.html
          touch _site/.nojekyll

          # Custom domain — only claimed when GAME_DOMAIN is set, so the build is
          # safe to run before DNS exists. Set it (e.g. play.moji-studios.com)
          # once the Cloudflare CNAME is in place.
          if [ -n "${GAME_DOMAIN}" ]; then
            echo "${GAME_DOMAIN}" > _site/CNAME
            echo "Custom domain: ${GAME_DOMAIN}"
          else
            echo "::notice::GAME_DOMAIN not set — serving at the default github.io URL (no custom domain claimed)."
          fi

          # Heavy art streams from jsDelivr over this repo, PINNED to this commit
          # SHA so the CDN copy is immutable and never stale. Rewrite every
          # relative asset reference (JS strings, CSS url(), static HTML — all
          # share the form <quote-or-paren>Dir/ ) to the CDN. The committed game
          # keeps relative paths for local dev.
          CDN_BASE="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          for f in _site/index.html _site/mojiworld_game.html; do
            sed -i -E "s#([\"'(])(Sprites|audio|backgrounds)/#\1${CDN_BASE}/\2/#g" "$f"
          done
          echo "Heavy assets -> ${CDN_BASE}/{Sprites,audio,backgrounds}/"

          # Inject the live multiplayer endpoint so the in-game Multi panel
          # defaults to the production wss:// server instead of localhost.
          # Browsers block ws:// from an https page, so this MUST be a wss:// URL.
          # v0.29.423 — the game's built-in fallback is now the live relay
          # (MP_FALLBACK_URL), not ws://localhost:8080, so co-op works on a
          # plain deploy with no Actions variable set. This step is now an
          # OVERRIDE for pointing a deploy at a different relay, and it
          # rewrites the fallback literal — keep the two in sync.
          DEFAULT_RELAY="wss://mojiworld-mp.onrender.com"
          if [ -n "${MP_WSS_URL}" ]; then
            for f in _site/index.html _site/mojiworld_game.html; do
              sed -i "s#${DEFAULT_RELAY}#${MP_WSS_URL}#g; s#ws://localhost:8080#${MP_WSS_URL}#g" "$f"
            done
            echo "Injected MP endpoint: ${MP_WSS_URL}"
          else
            echo "MP_WSS_URL not set — using the built-in relay ${DEFAULT_RELAY}."
          fi
          # Fail loudly if the shipped build's relay DEFAULT is not wss://.
          # Browsers block ws:// from an https page, so a ws:// default silently
          # disables co-op for every player on the deploy. Matches only the
          # MP_FALLBACK_URL assignment — 'ws://localhost:8080' legitimately
          # remains as the ⚙ Advanced input placeholder and in the LAN help text.
          if ! grep -qE "const MP_FALLBACK_URL = 'wss://" _site/mojiworld_game.html; then
            echo "::error::MP_FALLBACK_URL is not a wss:// URL — co-op would be dead on the https deploy."
            grep -n "const MP_FALLBACK_URL" _site/mojiworld_game.html || true
            exit 1
          fi

          echo "Artifact file count: $(find _site -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
