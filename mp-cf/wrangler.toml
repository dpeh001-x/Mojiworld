# Mojiworld multiplayer — Cloudflare Worker + Durable Object (stable MMO-lite).
# A single always-on Durable Object holds all rooms in memory (like the relay)
# AND persists per-player saves to its storage, so players respawn where they
# logged off. SQLite-backed DO class => runs on the Cloudflare FREE plan.
#
# Deploy:  cd mp-cf && npm install && npx wrangler deploy
# Local:   npx wrangler dev   (miniflare emulates the DO + WebSockets)
name = "mojiworld-mp"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# The game client connects to ONE wss:// URL and names its room/channel inside
# the hello message, so we route every socket to a single DO instance.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "MojiRoom"

# SQLite-backed DO (new_sqlite_classes) — required for the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MojiRoom"]

# After first deploy you get  wss://mojiworld-mp.<your-subdomain>.workers.dev
# To serve it from your own domain instead, uncomment and adjust:
# [[routes]]
# pattern = "mp.moji-studios.com"
# custom_domain = true

# v0.30.1851 feedback portal - every player report is EMAILED to admin@moji-studios.com. Pick ONE transport (docs/guides/FEEDBACK_PORTAL.md):
#   A. Google Apps Script mailer (v0.30.1859, no app password, no 2-Step Verification, no DNS): paste mp-cf/mail_script.gs.txt into script.google.com as the mailbox,
#      deploy it as a web app, then `npx wrangler secret put MAIL_WEBHOOK_URL` with <web app address>?k=<the KEY in the script>. Nothing to change in this file.
#   B. Google SMTP (needs an app password, so 2-Step Verification): `npx wrangler secret put SMTP_PASS` (optional SMTP_USER, default admin@moji-studios.com).
#   C. Resend: `npx wrangler secret put RESEND_API_KEY` - nothing to change in this file.
#   D. Cloudflare Email Routing (only when the domain mail is NOT already Google/other): enable it on moji-studios.com, verify the destination address, then uncomment:
# [[send_email]]
# name = "FEEDBACK_MAIL"
# destination_address = "admin@moji-studios.com"
# Order when several are set: Resend, Google SMTP, the Apps Script mailer, then the binding. The dashboard (/feedback-admin) has a "Test email" button that proves it.
# Optional overrides (defaults shown): FEEDBACK_EMAIL_TO = admin@moji-studios.com, FEEDBACK_EMAIL_FROM = feedback@moji-studios.com,
# FEEDBACK_GAP_MS = 3600000 (one report per connection per hour; 60000..86400000).
# [vars]
# FEEDBACK_EMAIL_TO = "admin@moji-studios.com"
