# Render Blueprint — Mojiworld multiplayer relay server.  ** STANDBY / SELF-HOST ONLY **
#
# The live game does NOT use this. Every shipped default — the game's MP_FALLBACK_URL, the Pages deploy and
# steam/relay.config.json — points at the Cloudflare Worker, which replaced this dyno after a Steam review
# could not connect to it (a 61 s cold HTTP start, and no WebSocket welcome inside 120 s). Keep it for
# self-hosting or as a fallback; do not re-point the game at it without re-testing that cold start.
# Gives the in-game Multi panel a public wss:// (TLS) endpoint to connect to.
#
# Deploy: https://dashboard.render.com -> New -> Blueprint -> pick this repo.
# Render builds the `mp/` Node server and serves it at
#   https://<name>.onrender.com   (WebSocket: wss://<name>.onrender.com)
# Then set the GitHub Actions variable MP_WSS_URL to that wss:// URL so the
# Pages deploy points the game at it. (See DEPLOY.md.)
#
# Note: the free plan cold-starts after ~15 min idle (first connect ~30-60s).
services:
  - type: web
    name: mojiworld-mp
    env: node
    plan: free
    rootDir: mp
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
