<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mojiworld — MMO-lite prototype</title>
<style>
  :root { --bg:#0d1018; --panel:#161b27; --line:#2a3346; --txt:#dfe6f2; --mut:#8a97ad; --acc:#5b8cff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; }
  input { background:#1d2434; border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 9px; font-size:12px; }
  button { background:var(--acc); border:1px solid var(--acc); color:#fff; border-radius:7px; padding:6px 12px; cursor:pointer; font-size:12px; font-weight:600; }
  .mut { color:var(--mut); }
  #wrap { padding:14px; }
  canvas { display:block; background:radial-gradient(120% 120% at 50% 0,#11151f,#0a0d14); border:1px solid var(--line); border-radius:10px; }
  #status b { color:#7ee787; }
  #hint { margin-top:8px; }
  kbd { background:#0a0d14; border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:11px; }
</style>
</head>
<body>
  <header>
    <h1>🌐 Mojiworld MMO-lite prototype</h1>
    <input id="name" placeholder="your name" maxlength="24" style="width:140px" />
    <button id="join">Join world</button>
    <span id="status" class="mut">not connected</span>
    <span class="mut">·</span>
    <span id="count" class="mut">0 players</span>
  </header>
  <div id="wrap">
    <canvas id="c" width="960" height="560"></canvas>
    <div id="hint" class="mut">Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows. Open this page in a 2nd tab/browser to see another player. Reload — the server remembers where you were (server-side save).</div>
  </div>

  <script src="mp_net.js"></script>
  <script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const statusEl = document.getElementById('status'), countEl = document.getElementById('count');
  const EMOJIS = ['🦊','🐸','🐯','🐼','🐧','🐙','🦉','🐲','🦄','🐝'];

  // local player — position is overwritten by the server's saved value on welcome
  const me = { x: 480, y: 280, facing: 1, anim: 'idle', hp: 100, level: 1, emoji: '🦊', name: '' };
  const keys = {};
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

  LXNet.onWelcome = (you) => {
    me.x = you.x; me.y = you.y; me.hp = you.hp; me.level = you.level;   // restore saved position
    me.emoji = EMOJIS[you.id % EMOJIS.length];
    statusEl.innerHTML = 'connected as <b>' + you.name + '</b> (id ' + you.id + ')';
  };
  LXNet.onStatus = (s) => { if (s === 'closed') statusEl.textContent = 'reconnecting…'; };

  document.getElementById('join').onclick = () => {
    me.name = document.getElementById('name').value.trim() || 'Player';
    LXNet.connect({ name: me.name });   // same-origin: ws://<this host>
  };

  function step() {
    const sp = 4;
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft'])  dx -= sp;
    if (keys['d'] || keys['arrowright']) dx += sp;
    if (keys['w'] || keys['arrowup'])    dy -= sp;
    if (keys['s'] || keys['arrowdown'])  dy += sp;
    me.x = Math.max(20, Math.min(940, me.x + dx));
    me.y = Math.max(20, Math.min(540, me.y + dy));
    if (dx) me.facing = dx < 0 ? -1 : 1;
    me.anim = (dx || dy) ? 'walk' : 'idle';
    LXNet.sendState(me);

    ctx.clearRect(0, 0, cv.width, cv.height);
    const others = LXNet.interpolated(performance.now());
    countEl.textContent = (others.length + (LXNet.connected ? 1 : 0)) + ' players';
    for (const p of others) drawPlayer(p.x, p.y, EMOJIS[p.id % EMOJIS.length], p.name, p.anim, false);
    if (LXNet.connected) drawPlayer(me.x, me.y, me.emoji, me.name + ' (you)', me.anim, true);
    requestAnimationFrame(step);
  }
  function drawPlayer(x, y, emoji, name, anim, isMe) {
    const bob = anim === 'walk' ? Math.sin(performance.now() / 90) * 3 : 0;
    ctx.font = '34px serif'; ctx.textAlign = 'center';
    ctx.fillText(emoji, x, y + bob);
    ctx.font = '11px system-ui'; ctx.fillStyle = isMe ? '#7ee787' : '#b9c4da';
    ctx.fillText(name || '?', x, y - 26);
    ctx.fillStyle = '#fff';
  }
  step();
  </script>
</body>
</html>
