<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Monster Animator — latest build</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#0d1018;
         color:#dfe6f2; font:14px/1.6 system-ui, "Segoe UI", Roboto, sans-serif; }
  .box { text-align:center; }
  .mut { color:#8a97ad; font-size:12px; }
  code { background:#161b27; border:1px solid #2a3346; border-radius:6px; padding:1px 7px; }
  a { color:#5b8cff; }
</style>
</head>
<body>
<div class="box">
  <div style="font-size:17px;font-weight:600">Monster Animator</div>
  <p id="msg" class="mut">finding the latest build…</p>
</div>
<script>
// CACHE-PROOF LAUNCHER (v0.29.206). This page's logic never changes, so it
// does not matter how long CDNs cache it. On every open it asks the GitHub
// API for main's current commit and redirects to that build's PINNED
// rawcdn.githack.com URL — immutable, never stale, no cache window at all.
// Bookmark THIS page; never bookmark the /main/ animator URL directly.
(async function () {
  const msg = document.getElementById('msg');
  const OWNER = 'dpeh001-x', REPO = 'Mojiworld';
  const FALLBACK = 'https://raw.githack.com/' + OWNER + '/' + REPO + '/main/monster_animator.html';
  try {
    const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/commits/main',
      { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub API ' + r.status);
    const sha = (await r.json()).sha;
    msg.innerHTML = 'opening build <code>' + sha.slice(0, 7) + '</code>…';
    location.replace('https://rawcdn.githack.com/' + OWNER + '/' + REPO + '/' + sha + '/monster_animator.html');
  } catch (e) {
    // rate-limited or offline API: fall back to the branch URL (may be cached)
    msg.innerHTML = 'could not resolve the latest commit (' + e.message +
      ') — <a href="' + FALLBACK + '">opening the branch URL instead</a> (may lag a few minutes)';
    setTimeout(() => location.replace(FALLBACK), 2500);
  }
})();
</script>
</body>
</html>
