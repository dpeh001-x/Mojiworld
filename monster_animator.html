<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mojiworld — Monster Animator v2</title>
<style>
  :root { --bg:#0d1018; --panel:#161b27; --panel2:#1d2434; --line:#2a3346; --txt:#dfe6f2; --mut:#8a97ad; --acc:#5b8cff; --idle:#4cc9f0; --walk:#ffd166; --attack:#ef476f; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; overflow:hidden; }
  h1 { font-size:14px; margin:0; letter-spacing:.3px; }
  .mut { color:var(--mut); }
  #side { width:230px; flex:0 0 230px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side header { padding:10px 12px; border-bottom:1px solid var(--line); }
  #q { width:100%; margin-top:8px; background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 9px; font-size:12px; }
  #list { overflow:auto; flex:1; padding:6px; }
  /* v0.30.x — variant rows sit under their boss with a rule down the left, so a
     per-attack set reads as "one of this boss's" rather than as another boss. */
  #list .row.kid { margin-left:14px; border-left:2px solid #2a3550; padding-left:8px; }
  #list .row.kid .nm { color:#9fb4d8; }
  #list .row.kid .vsfx { color:#e8c88a; font-weight:600; }
  #list .grp-end { height:5px; }
  .row { padding:7px 9px; border-radius:7px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .row:hover { background:var(--panel2); }
  .row.sel { background:#26314a; outline:1px solid var(--acc); }
  .row .nm { font-size:12px; }
  .tag { font-size:9px; padding:1px 5px; border-radius:6px; text-transform:uppercase; letter-spacing:.4px; }
  .tag.boss { background:#3a2030; color:#ffb3c8; }
  .tag.monster { background:#1f2f24; color:#9fe0b0; }
  .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; font-size:11px; }
  #bar .grow { flex:1; }
  #bar label { display:flex; align-items:center; gap:5px; color:var(--mut); }
  button { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 11px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  #stagewrap { flex:1; overflow:auto; background:radial-gradient(120% 120% at 50% 0,#11151f,#0a0d14); position:relative; }
  #stage { display:block; margin:0 auto; }
  #hint { position:absolute; left:12px; bottom:10px; font-size:11px; color:var(--mut); pointer-events:none; }
  .legend { display:flex; gap:14px; font-size:11px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  #ctrl { width:300px; flex:0 0 300px; background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:12px; }
  #ctrl .who { font-size:13px; font-weight:600; margin-bottom:2px; word-break:break-all; }
  .scard { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:11px; }
  .scard h3 { margin:0 0 8px; font-size:12px; display:flex; align-items:center; gap:7px; }
  .sl { display:grid; grid-template-columns:26px 1fr 58px; gap:8px; align-items:center; margin:7px 0; }
  .sl label { font-size:11px; color:var(--mut); }
  .sl input[type=range] { width:100%; }
  .sl input[type=number] { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:3px 5px; font-size:11px; }
  .srow { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .reset { font-size:10px; padding:3px 7px; }
  /* v0.30.x — frame-by-frame editor */
  .frnav { display:flex; align-items:center; gap:6px; margin:4px 0 6px; }
  .frnav button { padding:2px 9px; font-size:13px; line-height:1.2; }
  .frnav input[type=range] { flex:1; min-width:60px; }
  .frnav .lbl { font-size:11px; color:var(--mut); min-width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  #fr-card.held { border-color:#7ddba0; }
  #fr-card .held-note { font-size:11px; color:#7ddba0; }
  .empty { padding:40px 16px; text-align:center; color:var(--mut); }
  code { background:#0a0d14; padding:1px 5px; border-radius:5px; font-size:11px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1c2740; border:1px solid var(--acc); color:#fff; padding:9px 16px; border-radius:9px; font-size:12px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  .metric { display:flex; justify-content:space-between; font-size:11px; margin:2px 0; }
  .metric b { color:#cfe0ff; font-weight:600; }
  button.warn { color:#ffb3c8; }
/* ---- SFX board ---- */
  #sfxboard { flex:1; overflow:auto; background:#0d1018; padding:10px 14px; }
  .sfx-top { display:flex; gap:9px; align-items:center; flex-wrap:wrap; position:sticky; top:0; background:#0d1018; padding:6px 0 10px; border-bottom:1px solid var(--line); z-index:2; font-size:12px; }
  .sfx-top input[type=text], #sfx-q { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 9px; font-size:12px; width:210px; }
  .sfx-top select { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:5px 7px; font-size:12px; }
  .sfx-rows { display:flex; flex-direction:column; gap:3px; padding-top:8px; }
  .sfx-row { display:grid; grid-template-columns:30px 215px 92px 1fr 64px 74px; gap:9px; align-items:center; padding:5px 8px; border-radius:7px; background:var(--panel); font-size:12px; }
  .sfx-row:hover { background:var(--panel2); }
  .sfx-row.playing { outline:1px solid var(--acc); background:#1d2840; }
  .sfx-play { padding:2px 0; font-size:11px; }
  .sfx-id { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:#cfe0ff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sfx-cat { font-size:9px; text-transform:uppercase; letter-spacing:.4px; padding:2px 6px; border-radius:6px; background:#23304a; color:#9fb6e0; text-align:center; }
  .sfx-when { color:#b9c4da; font-size:11.5px; }
  .sfx-dur { font-size:10px; text-align:right; }
  .sfx-tick { display:flex; gap:4px; align-items:center; font-size:10.5px; color:#ffbf80; cursor:pointer; }
  .sfx-row:has([data-tick]:checked) { box-shadow:inset 3px 0 0 #ff9e3d; }

</style>
</head>
<body>
  <aside id="side">
    <header>
      <h1>Monster Animator <span class="mut">v2</span></h1>
      <div class="mut" style="font-size:11px;margin-top:3px">renders EXACTLY what the game renders</div>
      <!-- build badge: bump alongside GAME_VERSION on every animator change,
           so a stale cached copy is identifiable at a glance -->
      <div style="font-size:11px;margin-top:4px"><span id="lx-build-badge" style="background:#123524;color:#7ddba0;border:1px solid #2a5c40;border-radius:10px;padding:1px 8px;font-weight:600">build v0.30.226</span>
        <a id="lx-latest-link" href="animator.html" title="Cache-proof launcher: resolves main's current commit via the GitHub API and opens that exact build — use this if the badge looks old" style="color:#5b8cff;margin-left:6px">latest&#8599;</a></div>
      <script>
      // v0.29.246 — LIVE badge freshness probe. The static build string only
      // moves when THIS file changes, so a fully-current build can advertise an
      // old number after data-only pushes (calib bakes, sprite swaps). The badge
      // now verifies the SERVED COMMIT against main's tip on load and on every
      // tab refocus (>=30s apart): green "sha ✓ latest" when pinned at the tip,
      // red "STALE" + the newer sha when behind, amber when on the lagging
      // branch URL. Shares the launcher's lx_launcher_sha ETag cache — a 304
      // costs no GitHub rate-limit budget, so refocus probes are free.
      (function () {
        var b = document.getElementById('lx-build-badge'); if (!b) return;
        var base = b.textContent;
        var m = location.href.match(/rawcdn\.githack\.com\/dpeh001-x\/Mojiworld\/([0-9a-f]{40})\//i);
        var ref = m ? m[1] : (/raw\.githack\.com\/dpeh001-x\/Mojiworld\/[^/]+\//i.test(location.href) ? 'main' : 'local');
        if (ref === 'local') { b.textContent = base + ' · local'; return; }
        var LS = 'lx_launcher_sha', last = 0;
        function paint(bg, fg, bd) { b.style.background = bg; b.style.color = fg; b.style.borderColor = bd; }
        async function probe() {
          if (Date.now() - last < 30000) return; last = Date.now();
          var cache = null; try { cache = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
          var sha = null;
          try {
            var headers = { Accept: 'application/vnd.github+json' };
            if (cache && cache.etag) headers['If-None-Match'] = cache.etag;
            var r = await fetch('https://api.github.com/repos/dpeh001-x/Mojiworld/commits/main', { headers: headers, cache: 'no-store' });
            if (r.status === 304 && cache && cache.sha) sha = cache.sha;
            else if (r.ok) { sha = (await r.json()).sha; try { localStorage.setItem(LS, JSON.stringify({ sha: sha, etag: r.headers.get('ETag'), at: Date.now() })); } catch (e) {} }
          } catch (e) {}
          // v0.29.249 — 10-min age cap on the cached-sha fallback (mirrors the
          // launcher's v3 fix): after a rate-limit burst an hour-old sha could
          // paint a stale pinned build green "✓ latest".
          if (!sha && cache && cache.sha && cache.at && (Date.now() - cache.at) < 10 * 60 * 1000) sha = cache.sha;
          if (!sha) { b.textContent = base + ' · offline'; paint('#123524', '#7ddba0', '#2a5c40'); return; }
          if (ref === 'main') {
            b.textContent = base + ' · branch URL — may lag, use latest↗';
            paint('#3a2e12', '#e8c86a', '#5c4a2a');
          } else if (ref.toLowerCase() === sha.toLowerCase()) {
            b.textContent = base + ' · ' + sha.slice(0, 7) + ' ✓ latest';
            paint('#123524', '#7ddba0', '#2a5c40');
          } else {
            b.textContent = base + ' · STALE — latest is ' + sha.slice(0, 7);
            paint('#3a1515', '#ff9a9a', '#6b2a2a');
            var a = document.getElementById('lx-latest-link'); if (a) a.textContent = 'open latest↗';
          }
        }
        probe();
        window.addEventListener('focus', probe);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) probe(); });
      })();
      </script>
      <input id="q" placeholder="search… (e.g. krook, gravitos)" />
    </header>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="bar">
      <div class="legend">
        <span><i class="dot" style="background:var(--idle)"></i>idle</span>
        <span><i class="dot" style="background:var(--walk)"></i>walk</span>
        <span><i class="dot" style="background:var(--attack)"></i>attack</span>
      </div>
      <label title="Overlay this entity's states on one spot"><input type="checkbox" id="overlay" />overlay</label>
      <label title="Compose different sprites on one stage; click list entries to add layers"><input type="checkbox" id="compose" />compose</label>
      <label title="Show + edit THE attack hitbox (drag = move, corner / Alt+wheel = resize)"><input type="checkbox" id="hitbox" />hitbox</label>
      <label title="Every animation this boss owns, on one page, each at its real in-game size"><input type="checkbox" id="groupview" />group</label>
      <label title="Ghost the boss's idle sprite behind every animation, with a rule at its top edge, to size against"><input type="checkbox" id="idleref" />idle ref</label>
      <label title="Idle ping-pongs 130ms, walk 80ms, attack 48ms — the game's exact clocks"><input type="checkbox" id="gametiming" checked />game timing</label>
      <label title="1 stage px == 1 game px (the game's exact on-screen size)"><input type="checkbox" id="gamescale" checked />game scale 1:1</label>
      <span id="fpswrap" style="opacity:.35">fps<input type="range" id="fps" min="3" max="18" value="8" style="width:80px" disabled /><span id="fpsv">8</span></span>
      <div class="grow"></div>
      <button id="sfxmode" title="Browse, play and tag every game SFX">&#128266; SFX board</button>
      <button id="undo" title="Undo last change (Ctrl+Z)">&#8630; Undo</button>
      <button id="copycur" title="Copy ONLY the selected monster's calibration + hitboxes as a small patch — paste it in chat to have it hardbaked">&#128203; Copy patch</button>
      <button id="download" class="primary">Export anim_calib.js</button>
    </div>
    <div id="stagewrap">
      <canvas id="stage" width="900" height="520"></canvas>
      <div id="hint">Drag a sprite to nudge dx/dy · Alt + scroll-wheel to scale · numbers on the right are the exact in-game render</div>
    </div>
    <div id="sfxboard" style="display:none"></div>
  </main>
  <aside id="ctrl">
    <div class="empty" id="ctrlEmpty">Pick a monster or boss on the left to begin.</div>
    <div id="ctrlBody" style="display:none"></div>
  </aside>
  <div id="toast"></div>
  <!-- shared DATA files — the game loads these same files; that sharing IS the parity guarantee.
       v0.29.x — per-LOAD cache-bust (per user "clear cache every time it loads"): every data file
       is fetched with a fresh timestamp on every page load, so a stale browser/CDN copy of the
       calib/manifest/offsets/hitboxes can never mix with fresh code or fresh art again. -->
  <script>
    (function () {
      var t = Date.now();
      var files = ['data/anim_calib.js', 'data/anim_calib_manifest.js', 'data/mob_offsets.js', 'data/monster_hitboxes.js'];
      for (var i = 0; i < files.length; i++) {
        document.write('<scr' + 'ipt src="' + files[i] + '?t=' + t + '"></scr' + 'ipt>');
      }
      window.__LX_LOAD_STAMP = '?t=' + t;   // frame URLs reuse the same per-load stamp
    })();
  </script>
  <script>
/* ============================================================================
 * MONSTER ANIMATOR v2 — built from scratch (v0.29.x) around one hard rule:
 * the stage renders EXACTLY what mojiworld_game.html renders, verified by an
 * A/B pixel harness against the game's own _drawMonsterSprite/_drawBossSprite.
 *
 * GAME RENDER CORE — every constant/table below is a verbatim port.
 * KEEP IN SYNC with mojiworld_game.html:
 *   sizeFactor refs/clamps · BOSS_DRAW_SCALE · _ATK_FRAME_SCALE ·
 *   GROUND_BURY_FRAC / FLOATING_GROUND_BLEED / _BURY_MAX_PX ·
 *   _MOB_SPRITE_FOOT_NUDGE + per-type px nudges · _BOSS_SPRITE_PUSH_DOWN ·
 *   boss content-norm (_BOSS_SIZE_STRICT / _BOSS_ATK_NOSHRINK /
 *   _BOSS_ATK_SCALE / _BOSS_BODYLOCK) · frame clocks (130/80/48ms).
 * DATA stays in the shared external files (data/anim_calib.js + data/mob_offsets.js are
 * loaded by the game itself; the manifests are auto-generated).
 * ========================================================================== */
(function () {
  'use strict';
  const MAN = window.LX_ANIM_MANIFEST || {};
  const HB = window.LX_MOB_HITBOX || {};
  // v0.30.x — LX_MOB_HITBOX is keyed on the game's MONSTER TYPES, and a
  // per-attack set is not one: kingKrookstomp, gravitospunch and
  // towerSovereigncolumn have no entry, so geometry() lost its game base and
  // fell back to the 220px normalized preview while still labelling the result
  // "in-game". The GAME sizes from m.h of the live monster — the boss — no
  // matter which art set it draws, so gravitos punching is gravitos-sized.
  // Fall back to the longest hitbox key this type starts with, provided the
  // remainder begins lowercase or with a digit (which keeps kingKrook clear of
  // king). Resolves all 16 per-attack sets; memoized, the table is static.
  const _hbRootMemo = Object.create(null);
  function hbFallback(type) {
    if (type in _hbRootMemo) return _hbRootMemo[type];
    let best = null;
    if (!HB[type]) {
      for (const p in HB) {
        if (p === type || !type.startsWith(p)) continue;
        const rest = type.slice(p.length);
        if (!rest || !/^[a-z0-9]/.test(rest)) continue;
        if (!best || p.length > best.length) best = p;
      }
    }
    return (_hbRootMemo[type] = best ? HB[best] : null);
  }
  const BAKED_CALIB = window.LX_ANIM_CALIB || {};
  const BAKED_HB = window.LX_ATK_HITBOX || {};
  // v0.30.x — the five special states. Only entities that own one ever show
  // it (every consumer gates on ent.states[st]), so a normal monster is still
  // a three-column preview.
  const STATES = ['idle', 'walk', 'attack', 'charge', 'fly', 'pounce', 'duck', 'weave'];
  const COL = {
    idle: '#4cc9f0', walk: '#ffd166', attack: '#ef476f',
    charge: '#ff8c42', fly: '#7ddba0', pounce: '#c77dff', duck: '#9dc0ff', weave: '#f0a6ca',
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const DISPLAY_H = 220;                 // preview height when gameScale is OFF

  // ---- game constants (verbatim) ----
  const MONSTER_SIZE_REF = 768, BOSS_SIZE_REF = 1024;
  // NOTE: the boss draw multiplier comes from monster_hitboxes.js (hb.mul,
  // generated from the game's BOSS_DRAW_SCALE keyed on m.type) — the GAME keys
  // it on m.type, so every Gravitos PHASE form (gravitos2/3/star) inherits
  // gravitos's 0.95. A per-entity BOSS_DRAW_SCALE lookup here previewed the
  // phases 2.1x too big (the export-#8 mis-tune); hb.mul is the truth.
  const ATK_FRAME_SCALE = {                              // monster path (_ATK_FRAME_SCALE)
    fatDragon: 1.951, smithgolem: 1.881, tombKeeper: 2.13, forgewight: 2.327,
    pathsBane: 1.604, echoKnight: 2.10, conductorMech: 1.69,
  };
  const GROUND_BURY_FRAC = 0.02, FLOATING_GROUND_BLEED = 0.04, BURY_MAX_PX = 6;
  const FOOT_NUDGE_FRAC = { slime: 0.14 };
  const PRE_CLAMP_PX = { boneGolem: 10, seastar: 10 };
  const POST_CLAMP_PX = { boneGolem: 10, grumpsquid: 4, echoKnight: 7, future_lyra: 9, seastar: 6 };
  const BOSS_PUSH_DOWN_PX = { young_confused_barnaby: 6 };
  // boss content-norm tables (verbatim)
  const SIZE_STRICT = new Set(['gravitos', 'gravitos2', 'gravitos3', 'gravitos2star', 'gravitos3star']);
  const ATK_NOSHRINK = new Set(['sundered_smith', 'gravitos2star', 'gravitos3star']);
  const BOSS_ATK_SCALE = { kingKrook: 1.10 };   // v0.29.186 — restored (v0.29.179 rollback)
  const BODYLOCK = new Set(['aetherion', 'aetherion2']);
  // v0.29.195 — frame-trust bosses: per-frame norm skipped entirely (game
  // parity — see _BOSS_FRAME_TRUST in mojiworld_game.html). Constant box +
  // constant base anchor; frames play exactly as authored.
  const FRAME_TRUST = new Set(['aetherion', 'aetherion2']);
  // v0.30.x — verbatim from the game: _BOSS_IDLE_FRAME_MS 130, _BOSS_WALK 80,
  // _BOSS_ATK 48, _BOSS_DUCK 30, _BOSS_WEAVE 70. The zodiac trio takes its
  // cadence from its own call sites - fly loops at the WALK ms, pounce and
  // charge at the ATTACK ms. A state missing from this table indexes to
  // undefined, which makes the frame index NaN and draws nothing.
  const GAME_FRAME_MS = { idle: 130, walk: 80, attack: 48, duck: 30, weave: 70, fly: 80, pounce: 48, charge: 48 };

  function sizeFactor(group, w, h) {
    const f = Math.max(w, h) / (group === 'boss' ? BOSS_SIZE_REF : MONSTER_SIZE_REF);
    return group === 'boss' ? clamp(f, 0.7, 1.6) : clamp(f, 0.85, 1.2);
  }

  // ---- live Monster Plant values (localStorage 'lx_mob_scale'/'lx_mob_yoff'
  //      > baked mob_offsets.js > 1/0); MONSTERS only, like the game ----
  let _lsScale = null, _lsYoff = null;
  const _lsMap = (key, cacheSet) => {
    try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (_) { return {}; }
  };
  window.addEventListener('storage', () => { _lsScale = null; _lsYoff = null; if (window.__ui) window.__ui.refresh(); });
  function plantScale(t) {
    if (MAN[t] && MAN[t].group === 'boss') return 1;
    if (!_lsScale) _lsScale = _lsMap('lx_mob_scale');
    let v = Object.prototype.hasOwnProperty.call(_lsScale, t) ? +_lsScale[t] : +((window.LX_MOB_SCALE_DATA || {})[t]);
    return (isFinite(v) && v > 0) ? clamp(v, 0.3, 4) : 1;
  }
  function plantYOff(t) {
    if (MAN[t] && MAN[t].group === 'boss') return 0;
    if (!_lsYoff) _lsYoff = _lsMap('lx_mob_yoff');
    if (Object.prototype.hasOwnProperty.call(_lsYoff, t)) return (+_lsYoff[t]) || 0;
    return (+((window.LX_MOB_OFFSET_DATA || {})[t])) || 0;
  }

  // ---- live BASE-sprite images (the game's refImg for MONSTERS) ----
  const _baseImgs = new Map();
  function baseImg(type) {
    const ent = MAN[type];
    if (!ent || !ent.basePath) return null;
    let im = _baseImgs.get(type);
    // v0.29.x — per-load stamp on base sprites too (the old `typeof STAMP` never
    // resolved here: STAMP was const-scoped to the app module, so bases loaded
    // unstamped and could serve from a stale cache).
    if (!im) { im = new Image(); im.src = ent.basePath + (typeof window.__LX_LOAD_STAMP === 'string' ? window.__LX_LOAD_STAMP : ''); _baseImgs.set(type, im); }
    return (im.complete && im.naturalWidth) ? im : null;
  }

  // ---- boss content-norm (verbatim port of _drawBossSprite's pass) ----
  // Pixel readback FAILS on file:// pages (canvas taint) — that silently
  // disabled the norm and previewed boss walk/attack ~40% small (the King
  // Krook screenshot bug). Fallback: per-frame content boxes baked into the
  // manifest by gen_anim_manifest.mjs (img.__mcb, stamped at frame load).
  let taintSeen = false;
  function noteTaint() {
    if (taintSeen) return; taintSeen = true;
    try {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;top:44px;left:50%;transform:translateX(-50%);background:#3a2b12;border:1px solid #ff9e3d;color:#ffd9a8;padding:6px 14px;border-radius:8px;font-size:11px;z-index:99';
      el.textContent = 'Pixel readback blocked (file:// page) — using content boxes baked in the manifest. Preview stays game-exact.';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 12000);

  function paint() {

    // more than one set — otherwise it is the same picture with less room.
    if (groupView && _familyOf(cur).length > 1) { paintGroup(); return; }
    const ent = MAN[cur];
    const states = STATES.filter(s => ent.states[s]);
    const groundY = cv.height - 64;
    if (overlay) {
      const cx = cv.width / 2;
      drawGround(cx, groundY, cv.width * 0.8, '', '#fff');
      if (idleRef) drawIdleRef(cx, groundY, cv.width * 0.8);
      for (const st of states) { drawState(ent, st, cx, groundY, st === focusState ? 1 : 0.4); columns.push({ state: st, cx, groundY }); }
      if (hbEdit && ent.states[focusState]) { const r = drawAtkHitbox(ent, focusState, cx, groundY); if (r) hbRects.push(r); }
      ctx.fillStyle = COL[focusState]; ctx.font = '600 12px system-ui'; ctx.textAlign = 'center';

        drawState(ent, st, cx, groundY, 1);
        if (hbEdit) { const r = drawAtkHitbox(ent, st, cx, groundY); if (r) hbRects.push(r); }

  }
  function frame(t) {

  requestAnimationFrame(frame);

  window.__app = {
    get cur() { return cur; }, get overlay() { return overlay; },
    get focusState() { return focusState; }, get hbEdit() { return hbEdit; },
    MAN, STATES, COL, DEF,
    buildList, select, loadFramesFor: (t) => loadFrames(MAN[t]),
    CALIB: () => CALIB, HBX: () => HBX,
    reloadCalib: () => { CALIB = loadCalib(); },
    restore: (c, h) => { if (c) CALIB = c; if (h) HBX = h; },   // undo support
    hbFor, defaultHB,
    setHB: (t, st, v) => { (HBX[t] = HBX[t] || {})[st] = v; },
    clearHB: (t, st) => { if (HBX[t]) delete HBX[t][st]; },
    geomFor, gameMetrics, columns: () => columns, hbRects: () => hbRects,
    calibKey,
    setFps: v => { fps = v; }, setOverlay: v => { overlay = v; }, setFocus: v => { focusState = v; },
    setGameTiming: v => { gameTiming = !!v; }, getGameTiming: () => gameTiming,
    setGameScale: v => { C.setGameScale(v); }, getGameScale: () => C.getGameScale(),
    setHbEdit: v => { hbEdit = v; }, setCompose: v => { compose = v; }, getCompose: () => compose,
    setGroupView: v => { groupView = !!v; fit(); paint(); }, getGroupView: () => groupView,
    setIdleRef: v => { idleRef = !!v; paint(); }, getIdleRef: () => idleRef,
    setPinFrame: (i) => { pinFrame = (i == null) ? null : (i | 0); paint(); }, getPinFrame: () => pinFrame,
    frameCount: (st) => ((frames[st] && frames[st].length) || 0),
    shownFrame: (st) => pickFrame(st, frames[st]),
    idleRefRect: (cx, gy) => drawIdleRef(cx == null ? cv.width / 2 : cx, gy == null ? cv.height - 64 : gy, 0),
    groupTiles: () => (cur ? groupTiles() : []), familyOf: (t) => _familyOf(t),
    groupLayout: () => (cur ? groupLayout(groupTiles(), Math.max(560, document.getElementById('stagewrap').clientWidth - 4), idleRef ? idleRefSize() : null) : null),
    idleRefSize: () => idleRefSize(),
    gameFrameIndex: (st, arr) => C.gameFrameIndex(st, arr, nowT),   // compose shares the clock
    plantScale: C.plantScale, plantYOff: C.plantYOff,
    fit, paint: () => paint(), step: () => { frameIdx++; paint(); },
    _setNow: t => { nowT = t; },    // headless-verification hook (rAF pauses in hidden tabs)
  };
  window.__ui = { refresh: () => { if (window.__buildControls) window.__buildControls(); } };

  buildList('');
  fit();
  {
    // fit() restores the viewport-sized canvas when the view is switched off;
    // paintGroup() grows it again when it is switched on.
    const _gv = document.getElementById('groupview');
    if (_gv) _gv.addEventListener('change', () => { groupView = _gv.checked; fit(); paint(); });
    const _ir = document.getElementById('idleref');
    if (_ir) _ir.addEventListener('change', () => { idleRef = _ir.checked; paint(); });

  window.addEventListener('resize', fit);
})();
  </script>
  <script>
/* ============================ UI MODULE =====================================
 * Controls panel, canvas drag/scroll, undo, export. Consumes window.__app.
 * Edits live in memory only — ship a tuning via "Export anim_calib.js" and
 * commit the file. Legacy localStorage live-saves are imported once at boot
 * and the keys removed (the baked file is the game's single source of truth).
 * ========================================================================== */
(function () {
  'use strict';
  const A = window.__app;
  const RANGES = { s: [0.3, 3, 0.01], dx: [-0.6, 0.6, 0.005], dy: [-0.6, 0.6, 0.005] };
  const HB_RANGES = { w: [0.05, 2.5, 0.005], h: [0.05, 2.5, 0.005], ox: [-1, 1, 0.005], oy: [-1, 1, 0.005] };
  const isDefault = v => v.s === 1 && v.dx === 0 && v.dy === 0;

  // ---- undo (snapshot stack of calib + hitbox, capped) ----
  const HIST = [];
  function snapshot() {
    HIST.push(JSON.stringify({ c: A.CALIB(), h: A.HBX() }));
    if (HIST.length > 80) HIST.shift();
    updateUndoBtn();
  }
  function undo() {
    const s = HIST.pop();
    if (!s) { toast('Nothing to undo'); updateUndoBtn(); return; }
    const d = JSON.parse(s);
    A.restore(d.c, d.h);
    markDirty(); window.__buildControls();
    toast('Undone'); updateUndoBtn();
  }
  function updateUndoBtn() {
    const b = document.getElementById('undo');
    if (b) { b.disabled = !HIST.length; b.style.opacity = HIST.length ? '1' : '.45'; }
  }
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1400);
  }

  // ---- dirty tracking (in-memory edits, shipped only via Export) ----
  let dirty = false;
  function markDirty() {
    dirty = true;
    const b = document.getElementById('download');
    if (b && !/•/.test(b.textContent)) b.textContent = b.textContent.replace(/\s*$/, ' •');
  }
  function clearDirty() {
    dirty = false;
    const b = document.getElementById('download');
    if (b) b.textContent = b.textContent.replace(/\s*•\s*$/, '');
  }
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---- export payload: only non-default entries ship ----
  function compact() {
    const CC = A.CALIB(), out = {};
    for (const t of Object.keys(CC)) {
      const st = {};
      for (const s of A.STATES) {
        const v = CC[t][s]; if (!v) continue;
        const hasFs = Array.isArray(v.fs) && v.fs.some(f => +f !== 1);
        if (isDefault(v) && !hasFs) continue;
        const k = A.calibKey(t, s);   // zodiac states store as 'zodiac/<state>'
        st[k] = { s: +v.s.toFixed(4), dx: +v.dx.toFixed(4), dy: +v.dy.toFixed(4) };
        if (hasFs) st[k].fs = v.fs.map(f => +(+f).toFixed(4));
      }
      if (Object.keys(st).length) out[t] = st;
    }
    return out;
  }
  function compactHB() {
    const H = A.HBX(), out = {};
    for (const t of Object.keys(H)) {
      const st = {};
      for (const s of A.STATES) { const v = H[t][s]; if (v) st[s] = { w: +v.w.toFixed(4), h: +v.h.toFixed(4), ox: +v.ox.toFixed(4), oy: +v.oy.toFixed(4) }; }
      if (Object.keys(st).length) out[t] = st;
    }
    return out;
  }

  // ---- controls panel ----
  function slider(st, k, v) {
    const [mn, mx, step] = RANGES[k];
    return `<div class="sl"><label>${k}</label>` +
      `<input type="range" data-st="${st}" data-k="${k}" min="${mn}" max="${mx}" step="${step}" value="${v}" />` +
      `<input type="number" data-st="${st}" data-k="${k}" min="${mn}" max="${mx}" step="${step}" value="${v}" /></div>`;
  }
  // v0.30.x — FRAME-BY-FRAME. fs[] (per-frame scale) has been in the calib
  // format, the loader, the renderer and the exporter all along with no way to
  // author a value. This is the way in: hold a frame, then scale that frame.
  //
  // Bosses only, and the card says so for a monster rather than offering the
  // control anyway. The game applies fs in _drawBossSprite alone - drawMonster
  // has no frame index at the point it applies calibration - so a monster knob
  // would move the preview and nothing in the game, which is the bug fixed one
  // version ago wearing a different hat.
  function frameCard() {
    const st = A.focusState, n = A.frameCount(st);
    const isBoss = A.MAN[A.cur] && A.MAN[A.cur].group === 'boss';
    if (!n) return '';
    const pin = A.getPinFrame();
    const held = pin != null;
    const i = held ? Math.max(0, Math.min(pin, n - 1)) : (A.shownFrame(st) || 0);
    const v = A.CALIB()[A.cur][st];
    const cur = (v.fs && v.fs[i] > 0) ? +v.fs[i] : 1;
    const tuned = Array.isArray(v.fs) ? v.fs.filter(f => +f !== 1).length : 0;
    let h = `<div class="scard${held ? ' held' : ''}" id="fr-card">` +
      `<div class="srow"><h3>\u{1F39E}\u{FE0F} frame \u00b7 ${st}${tuned ? ` <span class="mut">(${tuned} tuned)</span>` : ''}</h3>` +
      `<button class="reset" id="fr-clear">clear all</button></div>` +
      `<div class="frnav">` +
        `<button id="fr-prev" title="previous frame (,)">\u25c0</button>` +
        `<input type="range" id="fr-idx" min="0" max="${n - 1}" step="1" value="${i}" />` +
        `<button id="fr-next" title="next frame (.)">\u25b6</button>` +
        `<span class="lbl" id="fr-lbl">${i + 1} / ${n}</span></div>` +
      `<label style="font-size:11px;display:flex;gap:6px;align-items:center;margin-bottom:6px">` +
        `<input type="checkbox" id="fr-hold"${held ? ' checked' : ''} /> hold this frame ` +
        `<span class="mut">(stepping holds automatically)</span></label>`;
    if (isBoss) {
      h += `<div class="sl"><label>scale</label>` +
        `<input type="range" id="fr-fs" min="0.5" max="2" step="0.005" value="${cur}" />` +
        `<input type="number" id="fr-fs-n" min="0.5" max="2" step="0.005" value="${cur}" /></div>` +
        `<button class="reset" id="fr-reset" style="width:100%">reset frame ${i + 1}</button>`;
    } else {
      h += `<div class="mut" style="font-size:11px;color:#e8c88a">Per-frame scale is a BOSS-only path in the game ` +
        `(<code>_drawBossSprite</code> applies <code>fs</code>; <code>drawMonster</code> has no frame index there). ` +
        `Stepping still works for inspection, but a per-frame value would not reach the game, so it is not offered.</div>`;
    }

  }

  function card(st, v) {
    return `<div class="scard" data-card="${st}">` +
      `<div class="srow"><h3><i class="dot" style="background:${A.COL[st]}"></i>${st}</h3>` +
      `<button class="reset" data-reset="${st}">reset</button></div>` +
      slider(st, 's', v.s) + slider(st, 'dx', v.dx) + slider(st, 'dy', v.dy) + `</div>`;
  }
  function hbSlider(st, k, v) {
    const [mn, mx, step] = HB_RANGES[k];
    return `<div class="sl"><label>${k}</label>` +
      `<input type="range" data-hbst="${st}" data-k="${k}" min="${mn}" max="${mx}" step="${step}" value="${v}" />` +
      `<input type="number" data-hbst="${st}" data-k="${k}" min="${mn}" max="${mx}" step="${step}" value="${v}" /></div>`;
  }
  function hbCard(st) {
    const custom = A.hbFor(A.cur, st);
    const v = custom || A.defaultHB(A.cur, st);
    return `<div class="scard" data-hbcard="${st}" style="border-color:${custom ? '#ff9e3d' : 'var(--line)'}">` +
      `<div class="srow"><h3><i class="dot" style="background:#ff9e3d"></i>${st} · hitbox${custom ? '' : ' <span class="mut">(default)</span>'}</h3>` +
      `<button class="reset" data-hbreset="${st}">default</button></div>` +
      hbSlider(st, 'w', v.w) + hbSlider(st, 'h', v.h) + hbSlider(st, 'ox', v.ox) + hbSlider(st, 'oy', v.oy) + `</div>`;
  }
  window.__buildControls = function () {
    const cur = A.cur, body = document.getElementById('ctrlBody'), empty = document.getElementById('ctrlEmpty');
    if (!cur) { body.style.display = 'none'; empty.style.display = 'block'; return; }
    empty.style.display = 'none'; body.style.display = 'block';
    const ent = A.MAN[cur], CC = A.CALIB()[cur];
    let html = `<div class="who">${cur}</div>` +
      `<div class="mut" style="font-size:11px;margin-bottom:4px">${ent.group} · base ${ent.base ? ent.base.w + '×' + ent.base.h : '—'} · click a state header to focus in overlay</div>`;
    // key-3 (Monster Plant) live readout — these values are already baked into
    // the preview render exactly like the game; edit them in-game with key 3.
    if (ent.group !== 'boss') {
      const ps = A.plantScale(cur), py = A.plantYOff(cur);
      const hot = ps !== 1 || py !== 0;
      html += `<div class="mut" style="font-size:11px;margin-bottom:10px;${hot ? 'color:#9dff4d' : ''}">` +
        `\u{1F331} Monster Plant (key 3 in-game): scale ${ps.toFixed(2)}× · y-offset ${py >= 0 ? '+' : ''}${py}px` +
        `${hot ? ' — applied to this preview' : ' (defaults)'}</div>`;
    } else {
      html += `<div style="margin-bottom:6px"></div>`;
    }
    // v0.29.x — in-game wiring notes for override-key sets: say WHERE a
    // dedicated attack set actually plays, so the preview isn't a mystery.
    const WIRING = {
      aetherionastral: '\u{2728} plays in-game as Aetherion’s ASTRAL JUDGEMENT — a 1500 ms telegraph with the burst on FRAME 6, then ~420 ms of aftermath. Form 2 falls back to the generic attack pose until an aetherion2astral set ships. NOTE: the game draws these frames with AETHERION’s geometry and calibration, not this set’s — so the sliders here move his attack calib, and the size shown is his.',
      gravitospunch: '\u{1F94A} plays in-game on form-1 Gravitos: Gravity Crush · Body Slam · Zip charge — once through per pattern window',
      gravitos2star: '\u{2600}\u{FE0F} plays in-game while form-2 Gravitos casts the Singularity / Collapse Rain supernova',
      gravitos3star: '\u{2600}\u{FE0F} plays in-game while form-3 Gravitos casts the Singularity / Collapse Rain supernova',
      kingKrookstomp: '\u{1F45E} ART ONLY \u2014 not wired to any attack yet. Intended as a strong stomp with a long stun; the sprite key still has to be chosen at the attack site.',
    };
    if (WIRING[cur]) html += `<div class="mut" style="font-size:11px;margin-bottom:10px;color:#7ddba0">${WIRING[cur]}</div>`;
    html += `<div class="scard" id="gm-card"><h3>\u{1F4D0} Game metrics (live)</h3><div id="gm-body" class="mut" style="font-size:11px;line-height:1.55">measuring…</div></div>`;
    html += frameCard();
    for (const st of A.STATES) if (ent.states[st]) html += card(st, CC[st]);
    if (A.hbEdit) {
      html += `<div class="mut" style="font-size:11px;margin:8px 0 6px">HITBOX — the region player attacks can hit. All scaling (size factor + Monster Plant) is baked into the box you see. w/h/ox/oy are fractions of sprite height; oy = bottom offset from the feet (+down). Drag the box in the stage, or its corner handle to resize.</div>`;
      for (const st of A.STATES) if (ent.states[st]) html += hbCard(st);
    }
    html += `<button class="warn reset" id="resetAll" style="width:100%;margin-top:2px">Reset ${cur} to defaults</button>`;
    body.innerHTML = html;
    wire();
  };

  // v0.30.x — frame editor wiring. Stepping implies holding: you cannot tune a
  // frame that is sliding past you.
  function stepFrame(d) {
    const st = A.focusState, n = A.frameCount(st); if (!n) return;
    const at = A.getPinFrame();
    const from = (at != null) ? at : (A.shownFrame(st) || 0);
    A.setPinFrame(((from + d) % n + n) % n);
    window.__buildControls();
  }
  function setFrameScale(raw) {
    const st = A.focusState, n = A.frameCount(st); if (!n) return;
    const pin = A.getPinFrame(); if (pin == null) return;
    const i = Math.max(0, Math.min(pin, n - 1));
    let val = +raw; if (!isFinite(val)) return;
    val = Math.max(0.5, Math.min(2, val));
    const v = A.CALIB()[A.cur][st];
    if (!Array.isArray(v.fs)) v.fs = new Array(n).fill(1);
    while (v.fs.length < n) v.fs.push(1);
    v.fs[i] = val;
    const r = document.getElementById('fr-fs'), b = document.getElementById('fr-fs-n');
    if (r) r.value = val; if (b) b.value = val;
    markDirty();
  }
  function wireFrameCard() {
    const idx = document.getElementById('fr-idx');
    const hold = document.getElementById('fr-hold');
    const prev = document.getElementById('fr-prev'), next = document.getElementById('fr-next');
    if (prev) prev.onclick = () => stepFrame(-1);
    if (next) next.onclick = () => stepFrame(1);
    if (idx) idx.addEventListener('input', () => { A.setPinFrame(+idx.value); window.__buildControls(); });
    if (hold) hold.addEventListener('change', () => {
      A.setPinFrame(hold.checked ? (A.shownFrame(A.focusState) || 0) : null);
      window.__buildControls();
    });
    for (const id of ['fr-fs', 'fr-fs-n']) {
      const el = document.getElementById(id); if (!el) continue;
      el.addEventListener('focus', snapshot, { once: true });
      el.addEventListener('input', () => setFrameScale(el.value));
    }
    const rst = document.getElementById('fr-reset');
    if (rst) rst.onclick = () => {
      snapshot();
      const st = A.focusState, pin = A.getPinFrame();
      const v = A.CALIB()[A.cur][st];
      if (Array.isArray(v.fs) && pin != null) { v.fs[Math.max(0, Math.min(pin, v.fs.length - 1))] = 1; }
      markDirty(); window.__buildControls(); toast('frame reset');
    };
    const clr = document.getElementById('fr-clear');
    if (clr) clr.onclick = () => {
      snapshot();
      const v = A.CALIB()[A.cur][A.focusState];
      delete v.fs;
      markDirty(); window.__buildControls(); toast('per-frame scales cleared');
    };
  }

  function syncCard(st) {
    const v = A.CALIB()[A.cur][st];
    ['s', 'dx', 'dy'].forEach(k => document.querySelectorAll(`[data-st="${st}"][data-k="${k}"]`).forEach(el => { el.value = v[k]; }));
  }
  function setVal(st, k, raw) {
    const [mn, mx] = RANGES[k]; let v = +raw; if (!isFinite(v)) return;
    A.CALIB()[A.cur][st][k] = Math.max(mn, Math.min(mx, v));
    syncCard(st); markDirty();
  }
  // hitbox numeric edit: materialize from default on first touch, then mutate
  function setHBVal(st, k, raw) {
    const [mn, mx] = HB_RANGES[k]; let v = +raw; if (!isFinite(v)) return;
    v = Math.max(mn, Math.min(mx, v));
    let hb = A.hbFor(A.cur, st);
    if (!hb) { hb = A.defaultHB(A.cur, st); A.setHB(A.cur, st, hb); }
    hb[k] = v;
    document.querySelectorAll(`[data-hbst="${st}"][data-k="${k}"]`).forEach(el => { el.value = v; });
    markDirty();
  }
  // 📐 Game-metrics card refresher — re-renders while the card exists (values
  // settle as frames decode; norm scales react to live calib edits).
  function updateGM() {
    const el = document.getElementById('gm-body');
    if (!el || !A.cur) return;
    const rows = []; let shared = null;
    for (const st of A.STATES) {
      const m = A.gameMetrics(st); if (!m) continue;
      shared = m;
      const col = ({ idle: 'var(--idle)', walk: 'var(--walk)', attack: 'var(--attack)' })[st] || '#fff';
      rows.push(`<div style="margin-bottom:5px"><b style="color:${col}">${st}</b>` +
        ` — <b style="color:#dfe6f2">${m.gameW} × ${m.gameH} px in-game</b>` +
        `<br>src ${m.srcW}×${m.srcH} · content ${m.contentH != null ? m.contentH + 'px' : '—'} · sf ${m.sizeFactor}` +
        `${m.normScale !== 1 ? ' · norm ×' + m.normScale : ''}` +
        `${m.atkScale !== 1 ? ' · atk ×' + m.atkScale : ''}` +
        `${m.calibS !== 1 ? ' · calib ×' + m.calibS : ''}` +
        ` · frames ${m.decoded}/${m.frames}</div>`);
    }
    if (shared) {
      rows.push(`<div style="border-top:1px solid var(--line);padding-top:5px;margin-top:2px">` +
        (shared.hb ? `hitbox ${shared.hb.w}×${shared.hb.h} · mul ${shared.hb.mul}` : 'hitbox —') +
        ` · plant ${(+shared.plant).toFixed(2)}×</div>`);
    }
    el.innerHTML = rows.length ? rows.join('') : 'measuring…';
  }
  function wire() {
    clearInterval(window.__gmT);
    window.__gmT = setInterval(updateGM, 600);
    updateGM();
    document.querySelectorAll('#ctrlBody input[data-st]').forEach(el => {
      el.addEventListener('focus', snapshot, { once: true });
      el.addEventListener('input', () => setVal(el.dataset.st, el.dataset.k, el.value));
    });
    document.querySelectorAll('#ctrlBody input[data-hbst]').forEach(el => {
      el.addEventListener('focus', snapshot, { once: true });
      el.addEventListener('input', () => setHBVal(el.dataset.hbst, el.dataset.k, el.value));
    });
    document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
      snapshot();
      const st = b.dataset.reset; A.CALIB()[A.cur][st] = A.DEF(); syncCard(st); markDirty(); toast(st + ' reset');
    });
    document.querySelectorAll('[data-hbreset]').forEach(b => b.onclick = () => {
      snapshot();
      const st = b.dataset.hbreset; A.clearHB(A.cur, st); markDirty(); window.__buildControls(); toast(st + ' hitbox -> game default');
    });
    wireFrameCard();
    document.querySelectorAll('[data-card]').forEach(c => c.addEventListener('mousedown', () => A.setFocus(c.dataset.card)));

    for (const c of cols) { const d = Math.abs(px - c.cx); if (d < bd) { bd = d; best = c.state; } }

      const onHandle = !!r;

      if (!r) { const st = stateAt(p.x); r = rects.find(q => q.st === st); }

      '// CALIB: s = size multiplier; dx/dy = nudge as a FRACTION of rendered sprite height (+dy = down).\n' +

      '// offset from the foot line (+down) — all fractions of rendered sprite height.\n' +

    const txt = header + 'window.LX_ANIM_CALIB = ' + JSON.stringify(data, null, 2) + ';\n' +

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    clearDirty();

  }

  // ---- per-monster PATCH export (v0.29.198) ----
  // Copies ONLY the selected entity's calibration + attack hitboxes as a tiny
  // tagged JSON snippet. Paste it in chat and it gets hardbaked into
  // anim_calib.js verbatim (merge key = "type"; states not present in the
  // patch are left as currently baked; a state at pure defaults is emitted

      if (C[st]) {

    const txt = JSON.stringify(patch);
    const done = () => toast('Patch for ' + cur + ' copied — paste it in chat to hardbake');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, () => window.prompt('Copy the patch for ' + cur + ':', txt));
    } else {

    }
  }
  document.getElementById('copycur').onclick = copyCurrentPatch;

  // ---- top bar wiring ----
  document.getElementById('q').addEventListener('input', e => A.buildList(e.target.value));
  document.getElementById('overlay').addEventListener('change', e => A.setOverlay(e.target.checked));
  const hintEl = document.getElementById('hint');
  const HINT_SPRITE = 'Drag a sprite to nudge dx/dy · Alt + scroll-wheel to scale · numbers on the right are the exact in-game render';
  const HINT_HB = 'HITBOX: drag anywhere in a column to move that state’s box · drag the orange corner handle to resize · Alt + scroll-wheel to scale the box';
  document.getElementById('hitbox').addEventListener('change', e => {
    A.setHbEdit(e.target.checked);

  // game timing owns the cadence — the manual fps slider only applies when off

    A.setGameTiming(e.target.checked);
    fpsEl.disabled = e.target.checked;

  <script>
/* ========================== COMPOSE MODULE ==================================
 * Overlays DIFFERENT sprites on one stage — each an independent layer with its
 * own state, position, scale and opacity (align a summon beside a hero, size
 * comparisons, scene mock-ups). Layers render through the SAME __core.geometry
 * as the single-entity stage, so relative sizes match the game exactly.
 * Session-only: lives in localStorage('lx_compose_scene'); never touches the
 * game's anim_calib data.
 * ========================================================================== */
(function () {
  'use strict';
  const A = window.__app, C = window.__core;
  const cv = document.getElementById('stage');
  const LS = 'lx_compose_scene';

  let LAYERS = [];        // {type, state, x, y, scale, alpha, frames, _rect}
  let active = -1, drag = null;
  const statesOf = t => A.STATES.filter(s => A.MAN[t] && A.MAN[t].states[s]);

  // ---- layer management ----
  function addLayer(type) {
    if (!A.MAN[type]) return;
    const L = { type, state: statesOf(type)[0] || 'idle', x: cv.width / 2, y: cv.height - 64,
                scale: 1, alpha: 1, frames: A.loadFramesFor(type) };
    L.x += (LAYERS.length % 5) * 46 - 92;   // stagger so new layers don't stack
    LAYERS.push(L); active = LAYERS.length - 1;
    buildPanel(); save();
  }
  function removeLayer(i) { LAYERS.splice(i, 1); if (active >= LAYERS.length) active = LAYERS.length - 1; buildPanel(); save(); }
  function raise(i) { if (i < LAYERS.length - 1) { const [l] = LAYERS.splice(i, 1); LAYERS.splice(i + 1, 0, l); active = i + 1; buildPanel(); save(); } }
  function lower(i) { if (i > 0) { const [l] = LAYERS.splice(i, 1); LAYERS.splice(i - 1, 0, l); active = i - 1; buildPanel(); save(); } }
  function clearAll() { LAYERS = []; active = -1; buildPanel(); save(); }

  // ---- persistence (scene only; frames rehydrated on load) ----
  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify(LAYERS.map(l => ({
        type: l.type, state: l.state, x: Math.round(l.x), y: Math.round(l.y),
        scale: +l.scale.toFixed(3), alpha: +l.alpha.toFixed(2) }))));
    } catch (_) {}
  }
  function load() {
    try {
      const a = JSON.parse(localStorage.getItem(LS) || '[]');
      LAYERS = a.filter(o => A.MAN[o.type]).map(o => ({ ...o, frames: A.loadFramesFor(o.type) }));
      active = LAYERS.length ? 0 : -1;
    } catch (_) { LAYERS = []; active = -1; }
  }

  // ---- render ----
  function drawLayer(ctx, L, frameIdx) {
    const arr = L.frames[L.state]; if (!arr || !arr.length) return;
    const idx = A.getGameTiming() ? A.gameFrameIndex(L.state, arr) : (frameIdx % arr.length);
    if (idx < 0) return;
    const img = arr[idx];
    if (!img || !img.complete || !img.naturalWidth) return;
    // the exact game geometry for THIS layer's type (content-norm, anchor
    // chain, attack multipliers all included)
    const g = C.geometry(L.type, L.state, img, L.frames.idle); if (!g) return;
    const am = g.atkMul || 1;
    const w = (g.drawW != null ? g.drawW : g.targetW) * L.scale * am, h = g.previewH * L.scale * am;
    const x = L.x - w / 2, y = L.y + g.anchorY * L.scale * am;   // foot-anchored at (L.x, L.y)
    ctx.save();
    ctx.globalAlpha = L.alpha;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    C.softDraw(ctx, img, x, y, w, h);   // v0.29.198 — game-parity edge feather
    ctx.restore();

  }
  function paint(ctx, cv, frameIdx) {
    const gy = cv.height - 64;
    ctx.strokeStyle = '#2a3346'; ctx.lineWidth = 1; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(cv.width, gy + 0.5); ctx.stroke();
    ctx.setLineDash([]);
    if (!LAYERS.length) {
      ctx.fillStyle = '#8a97ad'; ctx.font = '13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Compose mode — click entities on the left to add them as layers.', cv.width / 2, cv.height / 2);
      return;
    }
    LAYERS.forEach((L, i) => {
      drawLayer(ctx, L, frameIdx);
      if (i === active && L._rect) {
        ctx.strokeStyle = '#5b8cff'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
        ctx.strokeRect(L._rect.x, L._rect.y, L._rect.w, L._rect.h); ctx.setLineDash([]);
        ctx.fillStyle = '#5b8cff'; ctx.font = '600 10px system-ui'; ctx.textAlign = 'left';
        ctx.fillText(L.type + ' · ' + L.state, L._rect.x, L._rect.y - 4);
      }
    });
  }

  // ---- interaction (capture-phase so the calibration handlers never fire) ----
  function xy(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
  function layerAt(p) {
    for (let i = LAYERS.length - 1; i >= 0; i--) { const r = LAYERS[i]._rect; if (r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i; }

  }
  cv.addEventListener('mousedown', e => {
    if (!A.getCompose()) return;

    if (!drag) return;

    syncInputs(drag.i);
  }, true);
  window.addEventListener('mouseup', () => { if (drag) { save(); drag = null; } }, true);
  cv.addEventListener('wheel', e => {
    if (!A.getCompose()) return;
    if (!e.altKey) return;              // v0.30.x — bare wheel scrolls the pane
    e.stopImmediatePropagation(); e.preventDefault();
    const p = xy(e); let i = layerAt(p); if (i < 0) i = active; if (i < 0) return;
    const L = LAYERS[i];
    L.scale = Math.max(0.15, Math.min(6, L.scale * (e.deltaY < 0 ? 1.05 : 1 / 1.05)));
    active = i; syncInputs(i);
    clearTimeout(cv._cw); cv._cw = setTimeout(save, 250);
  }, true);

  // ---- toggle wiring ----
  const _origBuild = window.__buildControls;
  window.__buildControls = function () { if (A.getCompose()) buildPanel(); else _origBuild(); };
  document.getElementById('compose').addEventListener('change', e => {
    A.setCompose(e.target.checked);
    const hint = document.getElementById('hint');
    if (e.target.checked) {
      if (!LAYERS.length) load();
      buildPanel();
      if (hint) hint.textContent = 'COMPOSE: click entities (left) to add layers · drag to move · scroll to scale · adjust the active layer on the right';
    } else {
      window.__buildControls();
      if (hint) hint.textContent = 'Drag a sprite to nudge dx/dy · Alt + scroll-wheel to scale · numbers on the right are the exact in-game render';
    }
  });
  window.__compose = { addLayer, paint, layers: () => LAYERS };

  // ---- compose controls panel (right column) ----
  function numRow(i, k, v, mn, mx, step) {
    return `<div class="sl"><label>${k}</label>` +
      `<input type="range" data-lk="${k}" data-li="${i}" min="${mn}" max="${mx}" step="${step}" value="${v}" />` +
      `<input type="number" data-lk="${k}" data-li="${i}" min="${mn}" max="${mx}" step="${step}" value="${v}" /></div>`;
  }
  function syncInputs(i) {
    const L = LAYERS[i]; if (!L) return;
    ['scale', 'x', 'y', 'alpha'].forEach(k =>
      document.querySelectorAll(`[data-li="${i}"][data-lk="${k}"]`).forEach(el => { el.value = (k === 'x' || k === 'y') ? Math.round(L[k]) : L[k]; }));
  }
  function setLayerVal(i, k, raw) {
    const L = LAYERS[i]; if (!L) return; let v = +raw; if (!isFinite(v)) return;
    L[k] = (k === 'x' || k === 'y') ? v : Math.max(k === 'alpha' ? 0.05 : 0.15, v);
    syncInputs(i); save();
  }
  function buildPanel() {
    const body = document.getElementById('ctrlBody'), empty = document.getElementById('ctrlEmpty');
    empty.style.display = 'none'; body.style.display = 'block';
    let html = `<div class="who">Compose · ${LAYERS.length} layer${LAYERS.length !== 1 ? 's' : ''}</div>` +
      `<div class="mut" style="font-size:11px;margin-bottom:8px">Click entities on the left to add layers · drag on stage to move · scroll to scale. Session-only — never changes game calibration.</div>`;
    if (!LAYERS.length) html += `<div class="empty" style="padding:20px 8px">No layers yet.</div>`;
    LAYERS.forEach((l, i) => {
      const on = i === active;
      const opts = statesOf(l.type).map(s => `<option value="${s}"${s === l.state ? ' selected' : ''}>${s}</option>`).join('');
      html += `<div class="scard" data-lc="${i}" style="border-color:${on ? '#5b8cff' : 'var(--line)'};cursor:pointer">` +
        `<div class="srow"><h3 style="gap:6px">${on ? '▸ ' : ''}${l.type}</h3>` +
        `<span style="display:flex;gap:4px">` +
        `<button class="reset" data-lraise="${i}" title="bring forward">↑</button>` +
        `<button class="reset" data-llower="${i}" title="send back">↓</button>` +
        `<button class="reset warn" data-lrm="${i}" title="remove">✕</button></span></div>` +
        `<div class="sl"><label>st</label><select data-lst="${i}" style="grid-column:2/4;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:3px 5px;font-size:11px">${opts}</select></div>` +
        numRow(i, 'scale', l.scale, 0.15, 6, 0.01) + numRow(i, 'x', Math.round(l.x), 0, 4000, 1) +
        numRow(i, 'y', Math.round(l.y), 0, 3000, 1) + numRow(i, 'alpha', l.alpha, 0.05, 1, 0.05) + `</div>`;
    });
    if (LAYERS.length) html += `<button class="warn reset" id="composeClear" style="width:100%;margin-top:2px">Clear all layers</button>`;
    body.innerHTML = html;
    document.querySelectorAll('[data-lc]').forEach(c => c.addEventListener('mousedown', e => {
      if (e.target.closest('button,select,input')) return; active = +c.dataset.lc; buildPanel();
    }));
    document.querySelectorAll('select[data-lst]').forEach(s => s.addEventListener('change', () => { LAYERS[+s.dataset.lst].state = s.value; save(); }));
    document.querySelectorAll('#ctrlBody input[data-lk]').forEach(el => el.addEventListener('input', () => setLayerVal(+el.dataset.li, el.dataset.lk, el.value)));
    document.querySelectorAll('[data-lrm]').forEach(b => b.onclick = () => removeLayer(+b.dataset.lrm));
    document.querySelectorAll('[data-lraise]').forEach(b => b.onclick = () => raise(+b.dataset.lraise));
    document.querySelectorAll('[data-llower]').forEach(b => b.onclick = () => lower(+b.dataset.llower));
    const c = document.getElementById('composeClear'); if (c) c.onclick = () => clearAll();
  }
})();

/* monster_animator_sfx.js — SFX board for monster_animator.html.
 * Lists every game audio clip (sfx_manifest.js), plays them individually or in
 * sequence, shows WHEN each fires in-game, and lets you tick clips for a
 * ludo.ai regeneration pass. Ticks persist to localStorage('lx_sfx_regen');

(function () {
  'use strict';
  const MAN = window.LX_SFX_MANIFEST || [];
  const LS_KEY = 'lx_sfx_regen';
  let regen = {};
  try { regen = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (_) {}
  const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(regen)); } catch (_) {} };

  const board = document.getElementById('sfxboard');
  const stage = document.getElementById('stagewrap');
  const hint = document.getElementById('hint');
  if (!board) return;

  let cur = null;            // currently playing Audio element
  let playAllIdx = -1;       // -1 = not in play-all mode
  let filterCat = 'all', filterQ = '', onlyTicked = false;

  const cats = ['all', ...new Set(MAN.map(m => m.cat))];
  const visible = () => MAN.filter(m =>
    (filterCat === 'all' || m.cat === filterCat) &&
    (!onlyTicked || regen[m.id]) &&
    (!filterQ || m.id.toLowerCase().includes(filterQ) || m.when.toLowerCase().includes(filterQ)));

  function stop() {
    if (cur) { try { cur.pause(); } catch (_) {} cur = null; }
    playAllIdx = -1;
    board.querySelectorAll('.sfx-row.playing').forEach(r => r.classList.remove('playing'));
    const b = document.getElementById('sfx-playall'); if (b) b.textContent = '▶ Play all (filtered)';
  }
  function play(item, row, onEnd) {
    if (cur) { try { cur.pause(); } catch (_) {} }
    board.querySelectorAll('.sfx-row.playing').forEach(r => r.classList.remove('playing'));
    if (row) { row.classList.add('playing'); row.scrollIntoView({ block: 'nearest' }); }
    cur = new Audio(item.file);
    const durEl = row && row.querySelector('.sfx-dur');
    cur.addEventListener('loadedmetadata', () => { if (durEl) durEl.textContent = cur.duration.toFixed(2) + 's'; }, { once: true });
    cur.addEventListener('ended', () => { if (row) row.classList.remove('playing'); if (onEnd) onEnd(); }, { once: true });
    cur.addEventListener('error', () => { if (durEl) durEl.textContent = 'LOAD ERR'; if (onEnd) onEnd(); }, { once: true });
    cur.play().catch(() => { if (durEl) durEl.textContent = 'blocked'; if (onEnd) onEnd(); });
  }
  function playAll() {
    const list = visible();
    // BGM/boss themes are minutes long — in play-all, sample 2.5s then advance.
    let i = 0;
    const step = () => {
      if (i >= list.length || playAllIdx === -2) { stop(); return; }
      playAllIdx = i;
      const item = list[i];
      const row = board.querySelector('.sfx-row[data-id="' + CSS.escape(item.id) + '"]');
      let advanced = false;
      const next = () => { if (advanced) return; advanced = true; i++; setTimeout(step, 250); };
      play(item, row, next);
      const isLong = item.cat === 'bgm' || item.cat === 'ambient';   // boss clips are short intro VOICES now
      if (isLong) setTimeout(next, 2500);
    };
    const b = document.getElementById('sfx-playall'); if (b) b.textContent = '■ Stop';
    step();
  }

  function render() {
    const list = visible();
    const ticked = Object.keys(regen).filter(k => regen[k]).length;
    let h = '<div class="sfx-top">' +
      '<input id="sfx-q" placeholder="search id / trigger…" value="' + filterQ + '" />' +
      '<select id="sfx-cat">' + cats.map(c => '<option' + (c === filterCat ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>' +
      '<label class="mut"><input type="checkbox" id="sfx-onlyticked"' + (onlyTicked ? ' checked' : '') + '/> ticked only</label>' +
      '<button id="sfx-playall">▶ Play all (filtered)</button>' +
      '<span class="mut">' + list.length + ' shown · <b style="color:#ff9e3d">' + ticked + ' ticked for regen</b></span>' +
      '<button id="sfx-export" class="primary">⬇ Export regen list</button></div>' +
      '<div class="sfx-rows">';
    for (const m of list) {
      h += '<div class="sfx-row" data-id="' + m.id + '">' +
        '<button class="sfx-play" title="play">▶</button>' +
        '<span class="sfx-id" title="' + m.file + '">' + m.id + '</span>' +
        '<span class="sfx-cat cat-' + m.cat + '">' + m.cat + '</span>' +
        '<span class="sfx-when">' + m.when + '</span>' +
        '<span class="sfx-dur mut">' + m.kb + 'kB</span>' +
        '<label class="sfx-tick" title="tick to include in the ludo.ai regeneration export">' +
        '<input type="checkbox" data-tick="' + m.id + '"' + (regen[m.id] ? ' checked' : '') + '/> regen</label></div>';
    }
    h += '</div>';
    board.innerHTML = h;
    // wiring
    document.getElementById('sfx-q').addEventListener('input', e => { filterQ = e.target.value.toLowerCase(); render(); document.getElementById('sfx-q').focus(); document.getElementById('sfx-q').setSelectionRange(filterQ.length, filterQ.length); });
    document.getElementById('sfx-cat').addEventListener('change', e => { filterCat = e.target.value; render(); });
    document.getElementById('sfx-onlyticked').addEventListener('change', e => { onlyTicked = e.target.checked; render(); });
    document.getElementById('sfx-playall').addEventListener('click', () => { if (playAllIdx >= 0) { playAllIdx = -2; stop(); } else playAll(); });
    document.getElementById('sfx-export').addEventListener('click', exportList);
    board.querySelectorAll('.sfx-play').forEach(b => b.addEventListener('click', () => {
      const id = b.closest('.sfx-row').dataset.id;
      const item = MAN.find(m => m.id === id);
      if (item) play(item, b.closest('.sfx-row'));
    }));
    board.querySelectorAll('[data-tick]').forEach(c => c.addEventListener('change', () => {
      regen[c.dataset.tick] = c.checked; if (!c.checked) delete regen[c.dataset.tick];
      persist(); render();
    }));
  }

  function exportList() {
    const items = MAN.filter(m => regen[m.id]).map(m => ({ id: m.id, file: m.file, cat: m.cat, when: m.when,
      ludoNote: 'Regenerate via POST /audio/sound-effect (2cr). Current role: ' + m.when }));
    const blob = new Blob([JSON.stringify({ note: 'SFX ticked for ludo.ai regeneration (monster_animator SFX board)', count: items.length, items }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sfx_regen_list.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ---- mode toggle (top bar button) ----
  const btn = document.getElementById('sfxmode');
  let on = false;
  if (btn) btn.addEventListener('click', () => {
    on = !on;
    board.style.display = on ? 'block' : 'none';
    stage.style.display = on ? 'none' : 'block';
    if (hint) hint.style.display = on ? 'none' : 'block';
    btn.classList.toggle('primary', on);
    if (on) render(); else stop();
  });
})();
  </script>
  <script>
/* ==== LIVE UPDATE WATCHER (v0.29.222) ====================================
 * Pinned builds (opened via animator.html — the URL carries the commit sha)
 * poll GitHub every 45s with an ETag CONDITIONAL request (304s are free, no
 * rate-limit cost). The moment main moves, a banner offers a one-click jump
 * to the new pinned build — no more waiting out CDN caches mid-session. */
(function () {
  const m = location.pathname.match(/\/dpeh001-x\/Mojiworld\/([0-9a-f]{40})\//i);
  const own = m && m[1];
  if (!own) return;   // branch URL / local file — nothing to compare against
  const API = 'https://api.github.com/repos/dpeh001-x/Mojiworld/commits/main';
  let etag = null;
  const timer = setInterval(check, 45000);
  setTimeout(check, 4000);
  async function check() {
    try {
      const headers = { Accept: 'application/vnd.github+json' };
      if (etag) headers['If-None-Match'] = etag;
      const r = await fetch(API, { headers });
      if (r.status === 304 || !r.ok) return;
      etag = r.headers.get('ETag');
      const sha = (await r.json()).sha;
      if (sha && sha.toLowerCase() !== own.toLowerCase()) showBanner(sha);
    } catch (e) { /* offline — try again next tick */ }
  }
  function showBanner(sha) {
    clearInterval(timer);
    if (document.getElementById('updbar')) return;
    const d = document.createElement('div');
    d.id = 'updbar';
    d.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:999;' +
      'background:#123524;border:1px solid #2a5c40;border-top:none;border-radius:0 0 10px 10px;' +
      'color:#7ddba0;padding:6px 16px;font:600 12px system-ui;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.5)';
    d.textContent = '⬆ new build ' + sha.slice(0, 7) + ' is live — click to update';
    d.title = 'Opens the new pinned build. Unsaved slider edits are lost — Copy patch / Export first if needed.';
    d.onclick = () => { location.href = 'https://rawcdn.githack.com/dpeh001-x/Mojiworld/' + sha + '/monster_animator.html'; };
    document.body.appendChild(d);
  }
})();
  </script>
