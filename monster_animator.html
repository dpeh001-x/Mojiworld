<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LevelX — Monster Animator / Calibration</title>
<style>
  :root { --bg:#0d1018; --panel:#161b27; --panel2:#1d2434; --line:#2a3346; --txt:#dfe6f2; --mut:#8a97ad; --acc:#5b8cff; --idle:#4cc9f0; --walk:#ffd166; --attack:#ef476f; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; overflow:hidden; }
  h1 { font-size:14px; margin:0; letter-spacing:.3px; }
  .mut { color:var(--mut); }
  a { color:var(--acc); }
  /* ---- left: entity list ---- */
  #side { width:230px; flex:0 0 230px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side header { padding:10px 12px; border-bottom:1px solid var(--line); }
  #q { width:100%; margin-top:8px; background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 9px; font-size:12px; }
  #list { overflow:auto; flex:1; padding:6px; }
  .row { padding:7px 9px; border-radius:7px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .row:hover { background:var(--panel2); }
  .row.sel { background:#26314a; outline:1px solid var(--acc); }
  .row .nm { font-size:12px; }
  .tag { font-size:9px; padding:1px 5px; border-radius:6px; text-transform:uppercase; letter-spacing:.4px; }
  .tag.boss { background:#3a2030; color:#ffb3c8; }
  .tag.monster { background:#1f2f24; color:#9fe0b0; }
  .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  /* ---- center: stage ---- */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  #bar .grow { flex:1; }
  button { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 11px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button.warn { color:#ffb3c8; }
  #stagewrap { flex:1; overflow:auto; background:radial-gradient(120% 120% at 50% 0,#11151f,#0a0d14); position:relative; }
  #stage { display:block; margin:0 auto; }
  #hint { position:absolute; left:12px; bottom:10px; font-size:11px; color:var(--mut); pointer-events:none; }
  .legend { display:flex; gap:14px; font-size:11px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  /* ---- right: controls ---- */
  #ctrl { width:300px; flex:0 0 300px; background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:12px; }
  #ctrl .who { font-size:13px; font-weight:600; margin-bottom:2px; word-break:break-all; }
  .scard { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:11px; }
  .scard h3 { margin:0 0 8px; font-size:12px; display:flex; align-items:center; gap:7px; }
  .sl { display:grid; grid-template-columns:26px 1fr 58px; gap:8px; align-items:center; margin:7px 0; }
  .sl label { font-size:11px; color:var(--mut); }
  .sl input[type=range] { width:100%; }
  .sl input[type=number] { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:3px 5px; font-size:11px; }
  .srow { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .reset { font-size:10px; padding:3px 7px; }
  .empty { padding:40px 16px; text-align:center; color:var(--mut); }
  code { background:#0a0d14; padding:1px 5px; border-radius:5px; font-size:11px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1c2740; border:1px solid var(--acc); color:#fff; padding:9px 16px; border-radius:9px; font-size:12px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  /* ---- SFX board ---- */
  #sfxboard { flex:1; overflow:auto; background:#0d1018; padding:10px 14px; }
  .sfx-top { display:flex; gap:9px; align-items:center; flex-wrap:wrap; position:sticky; top:0; background:#0d1018; padding:6px 0 10px; border-bottom:1px solid var(--line); z-index:2; font-size:12px; }
  .sfx-top input[type=text], #sfx-q { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 9px; font-size:12px; width:210px; }
  .sfx-top select { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:5px 7px; font-size:12px; }
  .sfx-rows { display:flex; flex-direction:column; gap:3px; padding-top:8px; }
  .sfx-row { display:grid; grid-template-columns:30px 215px 92px 1fr 64px 74px; gap:9px; align-items:center; padding:5px 8px; border-radius:7px; background:var(--panel); font-size:12px; }
  .sfx-row:hover { background:var(--panel2); }
  .sfx-row.playing { outline:1px solid var(--acc); background:#1d2840; }
  .sfx-play { padding:2px 0; font-size:11px; }
  .sfx-id { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:#cfe0ff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sfx-cat { font-size:9px; text-transform:uppercase; letter-spacing:.4px; padding:2px 6px; border-radius:6px; background:#23304a; color:#9fb6e0; text-align:center; }
  .sfx-when { color:#b9c4da; font-size:11.5px; }
  .sfx-dur { font-size:10px; text-align:right; }
  .sfx-tick { display:flex; gap:4px; align-items:center; font-size:10.5px; color:#ffbf80; cursor:pointer; }
  .sfx-row:has([data-tick]:checked) { box-shadow:inset 3px 0 0 #ff9e3d; }
</style>
</head>
<body>
  <aside id="side">
    <header>
      <h1>Monster Animator</h1>
      <div class="mut" style="font-size:11px;margin-top:3px">scale &amp; reposition idle / walk / attack</div>
      <input id="q" placeholder="search… (e.g. wolf, gravitos)" />
    </header>
    <div id="list"></div>
  </aside>

  <main id="main">
    <div id="bar">
      <div class="legend">
        <span><i class="dot" style="background:var(--idle)"></i>idle</span>
        <span><i class="dot" style="background:var(--walk)"></i>walk</span>
        <span><i class="dot" style="background:var(--attack)"></i>attack</span>
      </div>
      <label class="mut" style="font-size:11px;display:flex;align-items:center;gap:5px" title="Overlay this entity's own idle/walk/attack states">
        overlay<input type="checkbox" id="overlay" />
      </label>
      <label class="mut" style="font-size:11px;display:flex;align-items:center;gap:5px" title="COMPOSE: overlay DIFFERENT sprites on one stage and adjust each independently. Click list entries to add them as layers; drag to move, scroll to scale.">
        compose<input type="checkbox" id="compose" />
      </label>
      <label class="mut" style="font-size:11px;display:flex;align-items:center;gap:5px" title="Show and edit THE hitbox (the region player attacks can hit). All scaling (size factor + Monster Plant) is baked in. Drag the box to move, drag the corner handle or scroll to resize.">
        hitbox<input type="checkbox" id="hitbox" />
      </label>
      <label class="mut" style="font-size:11px;display:flex;align-items:center;gap:5px">
        <!-- v0.29.139 — game-accurate playback: per-mode clocks (idle 130ms ping-pong /
             walk 80ms / attack 48ms, exactly the game's) + render at in-game on-screen
             scale. The fps slider only applies when "game timing" is unchecked. -->
        <label title="Play exactly what the game plays: idle ping-pongs at 130ms/frame, walk loops at 80ms, attack at 48ms — no extra frames, no seam repeats."><input type="checkbox" id="gametiming" checked />game timing</label>
        <label title="Render at the exact on-screen size the game draws this sprite (hitbox.h × mul × sizeFactor × plant-scale)."><input type="checkbox" id="gamescale" checked />game scale 1:1</label>
        <span id="fpswrap" style="opacity:0.35" title="Manual preview speed — only used when game timing is off.">fps<input type="range" id="fps" min="3" max="18" value="8" style="width:80px" disabled /><span id="fpsv">8</span></span>
      </label>
      <div class="grow"></div>
      <button id="sfxmode" title="Browse, play and tag every game SFX for regeneration">&#128266; SFX board</button>
      <button id="undo" title="Undo last change (Ctrl+Z)">&#8630; Undo</button>
      <button id="download" class="primary" title="Download the tuned anim_calib.js — commit it to the repo to ship">&#8681; Export anim_calib.js</button>
    </div>
    <div id="stagewrap">
      <canvas id="stage" width="900" height="520"></canvas>
      <div id="hint">Drag a sprite in the stage to nudge its X/Y · scroll-wheel over a sprite to scale</div>
    </div>
    <div id="sfxboard" style="display:none"></div>
  </main>

  <aside id="ctrl">
    <div class="empty" id="ctrlEmpty">Pick a monster or boss on the left to begin.</div>
    <div id="ctrlBody" style="display:none"></div>
  </aside>

  <div id="toast"></div>

  <!-- v0.29.x — SINGLE-FILE TOOL (per user "consolidate everything into a single
       file"): all animator LOGIC (app/ui/compose/sfx) is inlined below — edit it
       here; the old monster_animator_*.js modules are deleted. Only DATA stays
       external, deliberately:
         anim_calib.js + mob_offsets.js — the GAME loads these same files; sharing
           one copy is what keeps the animator seeing exactly what the game sees.
         anim_calib_manifest.js / monster_hitboxes.js / sfx_manifest.js — AUTO-
           GENERATED by scripts/gen_*.mjs; regenerated when assets change.
       Bump the single ?v= on data-shape changes. -->
  <script src="anim_calib.js?v=13"></script>
  <script src="anim_calib_manifest.js?v=12"></script>
  <script src="mob_offsets.js?v=12"></script>
  <script src="monster_hitboxes.js?v=12"></script>
  <script>
/* ======== inlined monster_animator_app.js (v0.29.x consolidation — the tool is single-file now; edit HERE) ======== */
/* monster_animator_app.js — drives monster_animator.html.
 * Replays idle/walk/attack for any animated monster/boss using the SAME
 * foot-anchor + sizeFactor math as the game, and lets you hand-tune a per-state
 * { s, dx, dy } calibration. Edits are in-memory only and ship via the UI's
 * "Export anim_calib.js" (bake); legacy localStorage live-saves are merged
 * once at boot and then cleared by the UI. */
(function () {
  'use strict';
  const MAN = window.LX_ANIM_MANIFEST || {};
  const BAKED = window.LX_ANIM_CALIB || {};
  const LS_KEY = 'lx_anim_calib';
  const STATES = ['idle', 'walk', 'attack'];
  const COL = { idle: '#4cc9f0', walk: '#ffd166', attack: '#ef476f' };
  const DEF = () => ({ s: 1, dx: 0, dy: 0 });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const DISPLAY_H = 220;            // on-screen px the BASE sprite renders to

  // ---- merged calibration (baked file < localStorage), mutated live ----
  function loadCalib() {
    let ls = null; try { ls = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (_) {}
    const out = {};
    for (const t of Object.keys(MAN)) {
      out[t] = {};
      for (const s of STATES) {
        const b = BAKED[t] && BAKED[t][s], l = ls && ls[t] && ls[t][s], e = l || b || DEF();
        out[t][s] = { s: +e.s > 0 ? +e.s : 1, dx: +e.dx || 0, dy: +e.dy || 0 };
      }
    }
    return out;
  }
  let CALIB = loadCalib();

  // ---- per-(type, state) ATTACK hitbox (the game's _atkMonBox override) ----
  // Units are FRACTIONS of the rendered visual height (same basis as calib
  // dx/dy): w/h = box size, ox = horizontal offset of box center from the foot
  // anchor, oy = offset of box BOTTOM from the foot line (+down). An entry only
  // exists when customized; otherwise the game keeps its default fraction box.
  const HB_LS_KEY = 'lx_atk_hitbox';
  const HB_BAKED = window.LX_ATK_HITBOX || {};
  function loadHitbox() {
    let ls = null; try { ls = JSON.parse(localStorage.getItem(HB_LS_KEY) || 'null'); } catch (_) {}
    const out = {};
    for (const t of Object.keys(MAN)) {
      out[t] = {};
      for (const s of STATES) {
        const e = (ls && ls[t] && ls[t][s]) || (HB_BAKED[t] && HB_BAKED[t][s]) || null;
        if (e) out[t][s] = { w: +e.w || 0.5, h: +e.h || 0.5, ox: +e.ox || 0, oy: +e.oy || 0 };
      }
    }
    return out;
  }
  let HBX = loadHitbox();
  // The game's DEFAULT attack box for (ent, st), in editor units — mirrors
  // _atkMonBox: centred fraction f of the visual box (monsters f=0.90, centred
  // vertically; bosses f=0.60, anchored at the foot growing upward).
  function defaultHB(ent, st) {
    const g = stateGeom(ent, st); if (!g) return { w: 0.5, h: 0.5, ox: 0, oy: 0 };
    const f = ent.group === 'boss' ? 0.60 : 0.90;
    const aspect = g.targetW / g.previewH;
    return ent.group === 'boss'
      ? { w: +(f * aspect).toFixed(4), h: f, ox: 0, oy: 0 }
      : { w: +(f * aspect).toFixed(4), h: f, ox: 0, oy: +(-(1 - f) / 2).toFixed(4) };
  }
  const hbFor = (t, st) => (HBX[t] && HBX[t][st]) || null;

  // ---- runtime state ----
  let cur = null, frames = {}, frameIdx = 0, fps = 8, lastT = 0, overlay = false, focusState = 'idle';
  // v0.29.139 — GAME-ACCURATE playback + scale (reconciled per user: "the
  // editor must play exactly what plays in the game, to on-screen scale").
  //   gameTiming (default ON): per-mode frame clocks lifted verbatim from the
  //     game — idle 130ms PING-PONG (_bossPingPongFrame: 0..n-1..1, 2n-2 step
  //     sequence), walk 80ms + attack 48ms straight loops (_bossLoopFrame) —
  //     driven by the same wall-clock modulo the game uses. The old flat-fps
  //     linear index remains only when the toggle is off.
  //   gameScale (default ON): render at the game's ON-SCREEN pixel size —
  //     targetH = hitbox.h x (boss ? mul||2 : 1.5) x sizeFactor(frame) x
  //     plantScale — instead of the DISPLAY_H-normalized preview size.
  //   No additional frames: only the leading run of DECODED frames plays
  //     (exact _readyN semantics); a 1-frame set holds static, never repeats
  //     or pads. The ping-pong seam means idle never double-plays frame 0/n-1
  //     back-to-back — identical to in-game.
  let gameTiming = true, gameScale = true, nowT = 0;
  const GAME_FRAME_MS = { idle: 130, walk: 80, attack: 48 };   // _BOSS_IDLE/WALK/ATK_FRAME_MS
  function decodedN(arr) {   // mirrors the game's monotonic _readyN cache
    let n = arr._readyN || 0;
    while (n < arr.length && arr[n] && arr[n].complete && arr[n].naturalWidth > 0) n++;
    return (arr._readyN = n);
  }
  function gameFrameIndex(st, arr, t) {
    const n = decodedN(arr);
    if (n === 0) return -1;              // nothing decoded -> draw nothing (game falls to static)
    if (n === 1) return 0;               // single frame holds
    if (st === 'idle') {                 // _bossPingPongFrame
      const seqLen = 2 * n - 2;
      const i = Math.floor(t / GAME_FRAME_MS.idle) % seqLen;
      return i < n ? i : seqLen - i;
    }
    return Math.floor(t / GAME_FRAME_MS[st] ) % n;   // _bossLoopFrame
  }
  // v2 — SINGLE hitbox model. The old green read-only "gameplay hitbox" +
  // orange "edit hitbox" pair confused (per user); now one editable box.
  let hbEdit = false, compose = false;
  const HB = window.LX_MOB_HITBOX || {};   // per-type gameplay hitbox (monster_hitboxes.js)
  // ---- LIVE mob plant-scale (mirrors the game's _lxMobScale merge) ----
  // localStorage 'lx_mob_scale' (R-key Monster Plant editor) > baked
  // mob_offsets.js (window.LX_MOB_SCALE_DATA) > 1. Cached; invalidated by the
  // cross-tab 'storage' event (editing scales in the game tab updates the
  // hitbox here live) and on entity select / hitbox toggle for same-tab edits.
  let _mobScaleLS = null;
  function _mobScaleMap() {
    if (_mobScaleLS) return _mobScaleLS;
    try { _mobScaleLS = JSON.parse(localStorage.getItem('lx_mob_scale') || '{}') || {}; }
    catch (_) { _mobScaleLS = {}; }
    return _mobScaleLS;
  }
  // v0.26.x — full key-3 (Monster Plant) sync: BOTH live tables mirrored.
  // lx_mob_scale multiplies the rendered sprite height in-game (targetH =
  // m.h x 1.5 x sizeFactor x scale); lx_mob_yoff adds raw world-px to the
  // draw-Y (positive = down). localStorage edit > baked mob_offsets.js > 1/0.
  let _mobYoffLS = null;
  function _mobYoffMap() {
    if (_mobYoffLS) return _mobYoffLS;
    try { _mobYoffLS = JSON.parse(localStorage.getItem('lx_mob_yoff') || '{}') || {}; }
    catch (_) { _mobYoffLS = {}; }
    return _mobYoffLS;
  }
  window.addEventListener('storage', (e) => {
    if (!e || e.key === null || e.key === 'lx_mob_scale' || e.key === 'lx_mob_yoff') {
      _mobScaleLS = null; _mobYoffLS = null;
      if (window.__buildControls) window.__buildControls();   // refresh the plant readout live
    }
  });
  function liveMobScale(t) {
    const ls = _mobScaleMap();
    let v;
    if (Object.prototype.hasOwnProperty.call(ls, t)) v = +ls[t];
    else { const baked = window.LX_MOB_SCALE_DATA || {}; v = +baked[t]; }
    return (isFinite(v) && v > 0) ? clamp(v, 0.3, 4) : 1;
  }
  function liveMobYOff(t) {
    const ls = _mobYoffMap();
    if (Object.prototype.hasOwnProperty.call(ls, t)) return (+ls[t]) || 0;
    const baked = window.LX_MOB_OFFSET_DATA || {};
    return (+baked[t]) || 0;
  }
  // Monster Plant values apply to MONSTERS only (bosses render through
  // _drawBossSprite, which has no key-3 channel).
  const plantScale = (t) => (MAN[t] && MAN[t].group === 'boss') ? 1 : liveMobScale(t);
  const plantYOff  = (t) => (MAN[t] && MAN[t].group === 'boss') ? 0 : liveMobYOff(t);

  // ===== faithful render model (mirrors mojiworld_game.html) =====
  function sizeFactor(group, w, h) {
    const ref = group === 'boss' ? 1024 : 768, f = Math.max(w, h) / ref;
    return group === 'boss' ? clamp(f, 0.7, 1.6) : clamp(f, 0.85, 1.2);
  }
  // ===== cross-state CONTENT NORMALISATION (game v0.26.479 + v0.29.122) =====
  // Per user: "the size calibration between walk idle and attack does not seem
  // synced with the html editor". The game does NOT scale bosses purely by
  // canvas dimensions — _drawBossSprite measures each frame's OPAQUE content
  // height, compares it with the idle-set median reference, and rescales any
  // frame deviating >8% (>2% for the strict Gravitos family) so the figure is
  // a CONSTANT on-screen size across idle/walk/attack. The editor lacked this
  // pass, so states whose art fills the canvas differently rendered at
  // different sizes than in-game. This block is a faithful port:
  //   _BOSS_SIZE_STRICT   -> 2% tolerance (Gravitos family)
  //   _BOSS_ATK_NOSHRINK  -> attack frames may scale UP but never DOWN
  //   _BOSS_ATK_SCALE     -> per-type post-norm attack multiplier
  //   _BOSS_BODYLOCK      -> normalise on the SOLID body (alpha>235), not the
  //                          full silhouette (Aetherion's flared wings)
  const SIZE_STRICT   = new Set(['gravitos', 'gravitos2', 'gravitos3', 'gravitos2star', 'gravitos3star']);
  const ATK_NOSHRINK  = new Set(['sundered_smith', 'gravitos2star', 'gravitos3star']);
  const ATK_SCALE     = { koopaKing: 1.10 };
  // v0.29.x — MONSTER-path attack-box multiplier (per user: "forgewight attack
  // sprite is an anomaly compared to its normal sprite"). In the game, MONSTERS
  // don't run the boss content-norm at all: drawMonster derives the whole box
  // (sizeFactor, aspect, foot anchor) from the STATIC BASE sprite (refImg =
  // MONSTER_SPRITES[type]) and stretches every state frame into it; the ONLY
  // per-state size rule is _ATK_FRAME_SCALE — attack frames authored inside a
  // padded canvas get the box AND its dyOffset multiplied. KEEP IN SYNC with
  // _ATK_FRAME_SCALE in mojiworld_game.html.
  const ATK_FRAME_SCALE = {
    fatDragon: 1.951, smithgolem: 1.881, tombKeeper: 2.13, forgewight: 2.327,
    pathsBane: 1.604, echoKnight: 2.10, conductorMech: 1.69,
  };
  // v0.29.x — FULL game foot-anchor chain (per user "ensure it sees exactly
  // what it sees in game and vice versa"). The game does far more than
  // -botFrac×H: float lift / ground bury, per-type nudges, a 6px bury clamp
  // (which effectively re-plants most tall ground sprites at canvas-bottom =
  // foot+6px — the reason low-botFrac sprites hover in-game), and post-clamp
  // per-type pixel pushes. Ported verbatim. KEEP IN SYNC with
  // mojiworld_game.html (GROUND_BURY_FRAC / FLOATING_GROUND_BLEED /
  // _BURY_MAX_PX / _MOB_SPRITE_FOOT_NUDGE / the per-type px nudges /
  // _BOSS_SPRITE_PUSH_DOWN).
  const GROUND_BURY_FRAC = 0.02, FLOATING_GROUND_BLEED = 0.04, BURY_MAX_PX = 6;
  const FOOT_NUDGE_FRAC = { slime: 0.14 };                     // monster, pre-clamp, ×targetH
  const PRE_CLAMP_PX  = { boneGolem: 10, seastar: 10 };        // monster, pre-clamp (usually eaten by the clamp — kept for exactness)
  const POST_CLAMP_PX = { boneGolem: 10, grumpsquid: 4, echoKnight: 7, future_lyra: 9, seastar: 6 };  // monster, post-clamp
  const BOSS_PUSH_DOWN_PX = { young_confused_barnaby: 6 };     // boss, post-clamp
  function gameAnchorY(isBoss, type, flies, previewH, usedBotFrac, isNormed, pxR, yoffPx) {
    let a = -usedBotFrac * previewH;
    if (flies) a -= previewH * FLOATING_GROUND_BLEED;
    else a += previewH * GROUND_BURY_FRAC;
    if (!flies && !isBoss && FOOT_NUDGE_FRAC[type]) a += previewH * FOOT_NUDGE_FRAC[type];
    if (!flies && !isBoss && PRE_CLAMP_PX[type]) a += PRE_CLAMP_PX[type] * pxR;
    if (!flies) {
      // game: the VISIBLE bottom may sit at most 6px below the foot line.
      // Boss content-normed frames measure the content bottom; everything
      // else the canvas bottom.
      const visBottom = (isBoss && isNormed) ? (a + usedBotFrac * previewH) : (a + previewH);
      const cap = BURY_MAX_PX * pxR;
      if (visBottom > cap) a -= (visBottom - cap);
    }
    if (!isBoss && !flies && POST_CLAMP_PX[type]) a += POST_CLAMP_PX[type] * pxR;

  <script>

(function () {
  'use strict';

  // ---- undo (snapshot stack of calib + hitbox, capped) ----

  }
  // ---- dirty tracking (in-memory edits, shipped only via Export) ----
  let dirty = false;
  function markDirty() {
    dirty = true;

  }
  function clearDirty() {

  // ---- controls panel ----

      `<button class="reset" data-hbreset="${st}">default</button></div>` +
      hbSlider(st, 'w', v.w) + hbSlider(st, 'h', v.h) + hbSlider(st, 'ox', v.ox) + hbSlider(st, 'oy', v.oy) + `</div>`;
  }
  window.__buildControls = function () {
    const cur = A.cur, body = document.getElementById('ctrlBody'), empty = document.getElementById('ctrlEmpty');

    empty.style.display = 'none'; body.style.display = 'block';
    const ent = core.MAN[cur], C = core.CALIB()[cur];
    let html = `<div class="who">${cur}</div>` +
      `<div class="mut" style="font-size:11px;margin-bottom:4px">${ent.group} · base ${ent.base ? ent.base.w + '×' + ent.base.h : '—'} · click a state header to focus in overlay</div>`;
    // key-3 (Monster Plant) sync readout — these live values are baked into the

    if (ent.group !== 'boss' && core.plantScale) {

      html += `<div class="mut" style="font-size:11px;margin-bottom:10px;${hot ? 'color:#9dff4d' : ''}">` +
        `\u{1F331} Monster Plant (key 3 in-game): scale ${ps.toFixed(2)}× · y-offset ${py >= 0 ? '+' : ''}${py}px` +
        `${hot ? ' — applied to this preview' : ' (defaults)'}</div>`;
    } else {
      html += `<div style="margin-bottom:6px"></div>`;
    }
    // v0.29.x (per user "consolidate all info") — 📐 GAME METRICS card: one
    // place with everything the render uses, per state — the FINAL in-game
    // draw size (exactly what the stage shows at game-scale 1:1) plus source
    // dims, measured content height, sizeFactor, content-norm & attack scales,
    // frame decode status — and the shared hitbox / mul / plant values.
    // Values refresh live (see wire()) as frames decode.
    html += `<div class="scard" id="gm-card"><h3>\u{1F4D0} Game metrics (live)</h3><div id="gm-body" class="mut" style="font-size:11px;line-height:1.55">measuring…</div></div>`;
    for (const st of core.STATES) if (ent.states[st]) html += card(st, C[st]);
    if (A.hbEdit) {
      html += `<div class="mut" style="font-size:11px;margin:8px 0 6px">HITBOX — the region player attacks can hit. All scaling (size factor + Monster Plant) is baked into the box you see. w/h/ox/oy are fractions of sprite height; oy = bottom offset from the feet (+down). Drag the box in the stage, or its corner handle to resize.</div>`;
      for (const st of core.STATES) if (ent.states[st]) html += hbCard(st);
    }

  function syncCard(st) {
    const v = core.CALIB()[A.cur][st];
    ['s', 'dx', 'dy'].forEach(k => document.querySelectorAll(`[data-st="${st}"][data-k="${k}"]`).forEach(el => { el.value = v[k]; }));
  }
  function setVal(st, k, raw) {

  function setHBVal(st, k, raw) {

    v = Math.max(mn, Math.min(mx, v));

  }

  // card exists (values settle as frames decode; norm scales react to live
  // calib edits). One shared interval — cleared/re-armed on every rebuild.
  function updateGM() {
    const el = document.getElementById('gm-body');
    if (!el || !A.cur || !core.gameMetrics) return;
    const rows = [];
    let shared = null;
    for (const st of core.STATES) {
      const m = core.gameMetrics(st); if (!m) continue;
      shared = m;
      const col = ({ idle: 'var(--idle)', walk: 'var(--walk)', attack: 'var(--attack)' })[st] || '#fff';
      rows.push(`<div style="margin-bottom:5px"><b style="color:${col}">${st}</b>` +
        ` — <b style="color:#dfe6f2">${m.gameW} × ${m.gameH} px in-game</b>` +
        `<br>src ${m.srcW}×${m.srcH} · content ${m.contentH != null ? m.contentH + 'px' : '—'} · sf ${m.sizeFactor}` +
        `${m.normScale !== 1 ? ' · norm ×' + m.normScale : ''}` +
        `${m.atkScale !== 1 ? ' · atk ×' + m.atkScale : ''}` +
        `${m.calibS !== 1 ? ' · calib ×' + m.calibS : ''}` +
        ` · frames ${m.decoded}/${m.frames}</div>`);
    }
    if (shared) {
      rows.push(`<div style="border-top:1px solid var(--line);padding-top:5px;margin-top:2px">` +
        (shared.hb ? `hitbox ${shared.hb.w}×${shared.hb.h} · mul ${shared.hb.mul}` : 'hitbox —') +
        ` · plant ${(+shared.plant).toFixed(2)}×</div>`);

  }

  // ---- canvas drag (x/y) + wheel (scale) ----

    if (drag.kind === 'hbmove' || drag.kind === 'hbresize') {
      const hb = core.hbFor(A.cur, drag.st); if (!hb) return;

        // (bottom edge follows the cursor; oy compensates so the TOP stays put).

    v.s = Math.max(0.3, Math.min(3, v.s + (e.deltaY < 0 ? 0.03 : -0.03)));

  }, { passive: false });

  // ---- export anim_calib.js ----
  function exportFile() {

      '// Baked per-(monster/boss, state) animation calibration + attack hitboxes.\n' +

      '// HITBOX (_atkMonBox override): w/h = box size, ox = center x-offset, oy = bottom\n' +
      '// offset from the foot line (+down) — all fractions of rendered sprite height.\n' +
      '// Missing entries keep the game defaults.\n';

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    clearDirty();

  }

  // ---- top bar wiring ----
  document.getElementById('q').addEventListener('input', e => core.buildList(e.target.value));
  document.getElementById('overlay').addEventListener('change', e => core.setOverlay(e.target.checked));
  // v2 — ONE hitbox checkbox: shows THE editable box (drag to move, corner
  // handle / scroll-wheel to resize). The old separate read-only green box
  // toggle is gone.
  const hbEl = document.getElementById('hitbox');

/* ======== inlined monster_animator_compose.js (v0.29.x consolidation — the tool is single-file now; edit HERE) ======== */
/* monster_animator_compose.js — COMPOSE mode for monster_animator.html.
 * Overlays DIFFERENT sprites on one stage, each an independent layer with its
 * own state (idle/walk/attack), position, scale and opacity — for aligning a
 * summon beside a hero, an FX over a boss, size comparisons, scene mock-ups.
 * Session-only: the composition lives in localStorage('lx_compose_scene') and
 * NEVER touches the game's anim_calib data. Loaded after app.js + ui.js. */
(function () {
  'use strict';
  const core = window.__animCore;
  const cv = document.getElementById('stage');
  const STATES = core.STATES, MAN = core.MAN;
  const LS = 'lx_compose_scene';

  let LAYERS = [];        // {type, state, x, y, scale, alpha, frames, _rect}
  let active = -1, drag = null;

  const statesOf = (t) => STATES.filter(s => MAN[t] && MAN[t].states[s]);

  // ---- layer management ----
  function addLayer(type) {
    if (!MAN[type]) return;
    const L = { type, state: statesOf(type)[0] || 'idle', x: cv.width / 2, y: cv.height - 64,
                scale: 1, alpha: 1, frames: core.loadFramesFor(type) };
    L.x += (LAYERS.length % 5) * 46 - 92;   // stagger so new layers don't perfectly stack
    LAYERS.push(L); active = LAYERS.length - 1;
    buildPanel(); save();
  }
  function removeLayer(i) { LAYERS.splice(i, 1); if (active >= LAYERS.length) active = LAYERS.length - 1; buildPanel(); save(); }
  function raise(i) { if (i < LAYERS.length - 1) { const [l] = LAYERS.splice(i, 1); LAYERS.splice(i + 1, 0, l); active = i + 1; buildPanel(); save(); } }
  function lower(i) { if (i > 0) { const [l] = LAYERS.splice(i, 1); LAYERS.splice(i - 1, 0, l); active = i - 1; buildPanel(); save(); } }
  function clearAll() { LAYERS = []; active = -1; buildPanel(); save(); }

  // ---- persistence (scene only; frames rehydrated on load) ----
  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify(LAYERS.map(l => ({
        type: l.type, state: l.state, x: Math.round(l.x), y: Math.round(l.y),
        scale: +l.scale.toFixed(3), alpha: +l.alpha.toFixed(2) }))));
    } catch (_) {}
  }
  function load() {
    try {
      const a = JSON.parse(localStorage.getItem(LS) || '[]');
      LAYERS = a.filter(o => MAN[o.type]).map(o => ({ ...o, frames: core.loadFramesFor(o.type) }));
      active = LAYERS.length ? 0 : -1;
    } catch (_) { LAYERS = []; active = -1; }
  }

  // ---- render ----
  function drawLayer(ctx, L, frameIdx) {
    const arr = L.frames[L.state]; if (!arr || !arr.length) return;
    // v0.29.139 — compose layers use the same game-accurate per-mode clock
    // (idle ping-pong 130ms / walk 80ms / attack 48ms) when game timing is on.
    const idx = (core.gameFrameIndex && core.getGameTiming && core.getGameTiming())
      ? core.gameFrameIndex(L.state, arr)
      : (frameIdx % arr.length);
    if (idx < 0) return;
    const img = arr[idx];
    if (!img || !img.complete || !img.naturalWidth) return;
    // v0.29.x — pass the live frame + idle set so the game's content-norm
    // (cross-state size constancy) applies on the compose stage too.
    const g = core.composeGeom(L.type, L.state, img, L.frames.idle); if (!g) return;
    // v0.29.x — monster attack-box multiplier (game's _ATK_FRAME_SCALE): padded
    // attack canvases draw into a proportionally larger box, anchor scaled too.
    const _am = g.atkMul || 1;
    const w = (g.drawW != null ? g.drawW : g.targetW) * L.scale * _am, h = g.previewH * L.scale * _am;   // frame-aspect draw width (game v0.29.160)
    const x = L.x - w / 2, y = L.y + (g.anchorY != null ? g.anchorY : -g.usedBotFrac * g.previewH) * L.scale * _am;   // foot-anchored at (L.x, L.y), full game anchor chain
    ctx.save();

    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();

  }
  function paint(ctx, cv, frameIdx) {
    const gy = cv.height - 64;
    ctx.strokeStyle = '#2a3346'; ctx.lineWidth = 1; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(cv.width, gy + 0.5); ctx.stroke();
    ctx.setLineDash([]);
    if (!LAYERS.length) {
      ctx.fillStyle = '#8a97ad'; ctx.font = '13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Compose mode — click entities on the left to add them as layers.', cv.width / 2, cv.height / 2);
      return;
    }
    LAYERS.forEach((L, i) => {
      drawLayer(ctx, L, frameIdx);
      if (i === active && L._rect) {
        ctx.strokeStyle = '#5b8cff'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
        ctx.strokeRect(L._rect.x, L._rect.y, L._rect.w, L._rect.h); ctx.setLineDash([]);
        ctx.fillStyle = '#5b8cff'; ctx.font = '600 10px system-ui'; ctx.textAlign = 'left';
        ctx.fillText(L.type + ' · ' + L.state, L._rect.x, L._rect.y - 4);
      }
    });
  }

  // ---- interaction (capture-phase so the calibration handlers never fire) ----
  function xy(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
  function layerAt(p) {
    for (let i = LAYERS.length - 1; i >= 0; i--) { const r = LAYERS[i]._rect; if (r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i; }
    return -1;
  }
  cv.addEventListener('mousedown', e => {
    if (!core.getCompose()) return;
    e.stopImmediatePropagation();
    const p = xy(e), i = layerAt(p);
    if (i < 0) return;

    e.stopImmediatePropagation(); e.preventDefault();
    const p = xy(e); let i = layerAt(p); if (i < 0) i = active; if (i < 0) return;
    const L = LAYERS[i];

    clearTimeout(cv._cw); cv._cw = setTimeout(save, 250);
  }, true);

  // buildPanel / syncInputs defined in the panel section below.
  function buildPanel() {}
  function syncInputs() {}

  // ---- toggle wiring ----
  const _origBuild = window.__buildControls;
  window.__buildControls = function () { if (core.getCompose()) buildPanel(); else _origBuild(); };
  const box = document.getElementById('compose');
  if (box) box.addEventListener('change', e => {
    core.setCompose(e.target.checked);
    const hint = document.getElementById('hint');
    if (e.target.checked) {
      if (!LAYERS.length) load();
      buildPanel();
      if (hint) hint.textContent = 'COMPOSE: click entities (left) to add layers · drag to move · scroll to scale · adjust the active layer on the right';
    } else {
      window.__buildControls();
      if (hint) hint.textContent = 'Drag a sprite in the stage to nudge its X/Y · scroll-wheel over a sprite to scale';
    }
  });

  window.__compose = { addLayer, paint, layers: () => LAYERS };
  // panel API used by the panel section
  window.__composeInternal = { get LAYERS() { return LAYERS; }, get active() { return active; }, set active(v) { active = v; },
    removeLayer, raise, lower, clearAll, save, statesOf,
    setBuildPanel: (fn) => { buildPanel = fn; }, setSyncInputs: (fn) => { syncInputs = fn; } };
})();

/* ---- compose controls panel (right column) ---- */
(function () {
  'use strict';
  const CI = window.__composeInternal;
  function numRow(i, k, v, mn, mx, step) {
    return `<div class="sl"><label>${k}</label>` +
      `<input type="range" data-lk="${k}" data-li="${i}" min="${mn}" max="${mx}" step="${step}" value="${v}" />` +
      `<input type="number" data-lk="${k}" data-li="${i}" min="${mn}" max="${mx}" step="${step}" value="${v}" /></div>`;
  }
  function syncInputs(i) {
    const L = CI.LAYERS[i]; if (!L) return;
    ['scale', 'x', 'y', 'alpha'].forEach(k =>
      document.querySelectorAll(`[data-li="${i}"][data-lk="${k}"]`).forEach(el => { el.value = (k === 'x' || k === 'y') ? Math.round(L[k]) : L[k]; }));
  }
  function setLayerVal(i, k, raw) {
    const L = CI.LAYERS[i]; if (!L) return; let v = +raw; if (!isFinite(v)) return;
    L[k] = (k === 'x' || k === 'y') ? v : Math.max(k === 'alpha' ? 0.05 : 0.15, v);
    syncInputs(i); CI.save();
  }
  function buildPanel() {
    const body = document.getElementById('ctrlBody'), empty = document.getElementById('ctrlEmpty');
    empty.style.display = 'none'; body.style.display = 'block';
    const L = CI.LAYERS;
    let html = `<div class="who">Compose · ${L.length} layer${L.length !== 1 ? 's' : ''}</div>` +
      `<div class="mut" style="font-size:11px;margin-bottom:8px">Click entities on the left to add layers · drag on stage to move · scroll to scale. Session-only — never changes game calibration.</div>`;
    if (!L.length) html += `<div class="empty" style="padding:20px 8px">No layers yet.</div>`;
    L.forEach((l, i) => {
      const on = i === CI.active;
      const opts = CI.statesOf(l.type).map(s => `<option value="${s}"${s === l.state ? ' selected' : ''}>${s}</option>`).join('');
      html += `<div class="scard" data-lc="${i}" style="border-color:${on ? '#5b8cff' : 'var(--line)'};cursor:pointer">` +
        `<div class="srow"><h3 style="gap:6px">${on ? '▸ ' : ''}${l.type}</h3>` +
        `<span style="display:flex;gap:4px">` +
        `<button class="reset" data-lraise="${i}" title="bring forward">↑</button>` +
        `<button class="reset" data-llower="${i}" title="send back">↓</button>` +
        `<button class="reset warn" data-lrm="${i}" title="remove">✕</button></span></div>` +
        `<div class="sl"><label>st</label><select data-lst="${i}" style="grid-column:2/4;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:3px 5px;font-size:11px">${opts}</select></div>` +
        numRow(i, 'scale', l.scale, 0.15, 6, 0.01) + numRow(i, 'x', Math.round(l.x), 0, 4000, 1) +
        numRow(i, 'y', Math.round(l.y), 0, 3000, 1) + numRow(i, 'alpha', l.alpha, 0.05, 1, 0.05) + `</div>`;
    });
    if (L.length) html += `<button class="warn reset" id="composeClear" style="width:100%;margin-top:2px">Clear all layers</button>`;
    body.innerHTML = html;
    document.querySelectorAll('[data-lc]').forEach(c => c.addEventListener('mousedown', e => {
      if (e.target.closest('button,select,input')) return; CI.active = +c.dataset.lc; buildPanel();
    }));
    document.querySelectorAll('select[data-lst]').forEach(s => s.addEventListener('change', () => { CI.LAYERS[+s.dataset.lst].state = s.value; CI.save(); }));
    document.querySelectorAll('#ctrlBody input[data-lk]').forEach(el => el.addEventListener('input', () => setLayerVal(+el.dataset.li, el.dataset.lk, el.value)));
    document.querySelectorAll('[data-lrm]').forEach(b => b.onclick = () => CI.removeLayer(+b.dataset.lrm));
    document.querySelectorAll('[data-lraise]').forEach(b => b.onclick = () => CI.raise(+b.dataset.lraise));
    document.querySelectorAll('[data-llower]').forEach(b => b.onclick = () => CI.lower(+b.dataset.llower));
    const c = document.getElementById('composeClear'); if (c) c.onclick = () => CI.clearAll();
  }
  CI.setBuildPanel(buildPanel);
  CI.setSyncInputs(syncInputs);
})();

  <script>
/* ======== inlined monster_animator_sfx.js (v0.29.x consolidation — the tool is single-file now; edit HERE) ======== */
/* monster_animator_sfx.js — SFX board for monster_animator.html.
 * Lists every game audio clip (sfx_manifest.js), plays them individually or in
 * sequence, shows WHEN each fires in-game, and lets you tick clips for a
 * ludo.ai regeneration pass. Ticks persist to localStorage('lx_sfx_regen');
 * Export downloads sfx_regen_list.json for the regen script. */
(function () {
  'use strict';
  const MAN = window.LX_SFX_MANIFEST || [];
  const LS_KEY = 'lx_sfx_regen';
  let regen = {};
  try { regen = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (_) {}
  const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(regen)); } catch (_) {} };

  const board = document.getElementById('sfxboard');
  const stage = document.getElementById('stagewrap');
  const hint = document.getElementById('hint');
  if (!board) return;

  let cur = null;            // currently playing Audio element
  let playAllIdx = -1;       // -1 = not in play-all mode
  let filterCat = 'all', filterQ = '', onlyTicked = false;

  const cats = ['all', ...new Set(MAN.map(m => m.cat))];
  const visible = () => MAN.filter(m =>
    (filterCat === 'all' || m.cat === filterCat) &&
    (!onlyTicked || regen[m.id]) &&
    (!filterQ || m.id.toLowerCase().includes(filterQ) || m.when.toLowerCase().includes(filterQ)));

  function stop() {
    if (cur) { try { cur.pause(); } catch (_) {} cur = null; }
    playAllIdx = -1;
    board.querySelectorAll('.sfx-row.playing').forEach(r => r.classList.remove('playing'));
    const b = document.getElementById('sfx-playall'); if (b) b.textContent = '▶ Play all (filtered)';
  }
  function play(item, row, onEnd) {
    if (cur) { try { cur.pause(); } catch (_) {} }
    board.querySelectorAll('.sfx-row.playing').forEach(r => r.classList.remove('playing'));
    if (row) { row.classList.add('playing'); row.scrollIntoView({ block: 'nearest' }); }
    cur = new Audio(item.file);
    const durEl = row && row.querySelector('.sfx-dur');
    cur.addEventListener('loadedmetadata', () => { if (durEl) durEl.textContent = cur.duration.toFixed(2) + 's'; }, { once: true });
    cur.addEventListener('ended', () => { if (row) row.classList.remove('playing'); if (onEnd) onEnd(); }, { once: true });
    cur.addEventListener('error', () => { if (durEl) durEl.textContent = 'LOAD ERR'; if (onEnd) onEnd(); }, { once: true });
    cur.play().catch(() => { if (durEl) durEl.textContent = 'blocked'; if (onEnd) onEnd(); });
  }
  function playAll() {
    const list = visible();
    // BGM/boss themes are minutes long — in play-all, sample 2.5s then advance.
    let i = 0;
    const step = () => {
      if (i >= list.length || playAllIdx === -2) { stop(); return; }
      playAllIdx = i;
      const item = list[i];
      const row = board.querySelector('.sfx-row[data-id="' + CSS.escape(item.id) + '"]');
      let advanced = false;
      const next = () => { if (advanced) return; advanced = true; i++; setTimeout(step, 250); };
      play(item, row, next);
      const isLong = item.cat === 'bgm' || item.cat === 'ambient';   // boss clips are short intro VOICES now
      if (isLong) setTimeout(next, 2500);
    };
    const b = document.getElementById('sfx-playall'); if (b) b.textContent = '■ Stop';
    step();
  }

  function render() {
    const list = visible();
    const ticked = Object.keys(regen).filter(k => regen[k]).length;
    let h = '<div class="sfx-top">' +
      '<input id="sfx-q" placeholder="search id / trigger…" value="' + filterQ + '" />' +
      '<select id="sfx-cat">' + cats.map(c => '<option' + (c === filterCat ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>' +
      '<label class="mut"><input type="checkbox" id="sfx-onlyticked"' + (onlyTicked ? ' checked' : '') + '/> ticked only</label>' +
      '<button id="sfx-playall">▶ Play all (filtered)</button>' +
      '<span class="mut">' + list.length + ' shown · <b style="color:#ff9e3d">' + ticked + ' ticked for regen</b></span>' +
      '<button id="sfx-export" class="primary">⬇ Export regen list</button></div>' +
      '<div class="sfx-rows">';
    for (const m of list) {
      h += '<div class="sfx-row" data-id="' + m.id + '">' +
        '<button class="sfx-play" title="play">▶</button>' +
        '<span class="sfx-id" title="' + m.file + '">' + m.id + '</span>' +
        '<span class="sfx-cat cat-' + m.cat + '">' + m.cat + '</span>' +
        '<span class="sfx-when">' + m.when + '</span>' +
        '<span class="sfx-dur mut">' + m.kb + 'kB</span>' +
        '<label class="sfx-tick" title="tick to include in the ludo.ai regeneration export">' +
        '<input type="checkbox" data-tick="' + m.id + '"' + (regen[m.id] ? ' checked' : '') + '/> regen</label></div>';
    }
    h += '</div>';
    board.innerHTML = h;
    // wiring
    document.getElementById('sfx-q').addEventListener('input', e => { filterQ = e.target.value.toLowerCase(); render(); document.getElementById('sfx-q').focus(); document.getElementById('sfx-q').setSelectionRange(filterQ.length, filterQ.length); });
    document.getElementById('sfx-cat').addEventListener('change', e => { filterCat = e.target.value; render(); });
    document.getElementById('sfx-onlyticked').addEventListener('change', e => { onlyTicked = e.target.checked; render(); });
    document.getElementById('sfx-playall').addEventListener('click', () => { if (playAllIdx >= 0) { playAllIdx = -2; stop(); } else playAll(); });
    document.getElementById('sfx-export').addEventListener('click', exportList);
    board.querySelectorAll('.sfx-play').forEach(b => b.addEventListener('click', () => {
      const id = b.closest('.sfx-row').dataset.id;
      const item = MAN.find(m => m.id === id);
      if (item) play(item, b.closest('.sfx-row'));
    }));
    board.querySelectorAll('[data-tick]').forEach(c => c.addEventListener('change', () => {
      regen[c.dataset.tick] = c.checked; if (!c.checked) delete regen[c.dataset.tick];
      persist(); render();
    }));
  }

  function exportList() {
    const items = MAN.filter(m => regen[m.id]).map(m => ({ id: m.id, file: m.file, cat: m.cat, when: m.when,
      ludoNote: 'Regenerate via POST /audio/sound-effect (2cr). Current role: ' + m.when }));
    const blob = new Blob([JSON.stringify({ note: 'SFX ticked for ludo.ai regeneration (monster_animator SFX board)', count: items.length, items }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sfx_regen_list.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ---- mode toggle (top bar button) ----
  const btn = document.getElementById('sfxmode');
  let on = false;
  if (btn) btn.addEventListener('click', () => {
    on = !on;
    board.style.display = on ? 'block' : 'none';
    stage.style.display = on ? 'none' : 'block';
    if (hint) hint.style.display = on ? 'none' : 'block';
    btn.classList.toggle('primary', on);
    if (on) render(); else stop();
  });
})();
