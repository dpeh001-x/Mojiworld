<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ocean" cx="0.38" cy="0.32" r="0.82">
      <stop offset="0" stop-color="#8FE0FF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0B5C9E"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="planetClip"><circle cx="256" cy="258" r="150"/></clipPath>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1030" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGlow)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="70" cy="86" r="3.2" opacity="0.9"/>
    <circle cx="120" cy="150" r="2" opacity="0.6"/>
    <circle cx="442" cy="120" r="2.6" opacity="0.85"/>
    <circle cx="404" cy="64" r="1.8" opacity="0.5"/>
    <circle cx="70" cy="410" r="2.2" opacity="0.7"/>
    <circle cx="150" cy="450" r="1.6" opacity="0.5"/>
    <circle cx="452" cy="392" r="2.4" opacity="0.75"/>
    <circle cx="420" cy="452" r="1.8" opacity="0.55"/>
    <circle cx="256" cy="60" r="1.8" opacity="0.6"/>
  </g>
  <!-- twinkle plus -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M96 62 v18 M87 71 h18"/>
    <path d="M436 430 v14 M429 437 h14"/>
  </g>

  <!-- orbit ring (behind planet) -->
  <g transform="rotate(-22 256 262)">
    <ellipse cx="256" cy="262" rx="198" ry="56" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.9"/>
  </g>

  <!-- planet -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="258" r="150" fill="url(#ocean)"/>
  </g>
  <g clip-path="url(#planetClip)">
    <!-- continents -->
    <path d="M150 176 q30 -20 66 -8 q26 10 14 34 q-14 26 -50 24 q-40 -2 -46 -22 q-6 -18 16 -28 Z" fill="url(#land)"/>
    <path d="M300 300 q34 -14 60 6 q22 18 4 44 q-20 26 -56 16 q-30 -10 -30 -34 q0 -22 22 -32 Z" fill="url(#land)"/>
    <path d="M132 300 q22 -8 34 8 q10 16 -6 28 q-20 12 -36 -2 q-12 -14 8 -34 Z" fill="url(#land)" opacity="0.95"/>
    <!-- gloss -->
    <ellipse cx="212" cy="196" rx="120" ry="96" fill="url(#gloss)"/>
  </g>

  <!-- face -->
  <g>
    <!-- cheeks -->
    <circle cx="188" cy="300" r="17" fill="#FB7185" opacity="0.35"/>
    <circle cx="324" cy="300" r="17" fill="#FB7185" opacity="0.35"/>
    <!-- eyes -->
    <g fill="#0B2740">
      <ellipse cx="214" cy="250" rx="17" ry="22"/>
      <ellipse cx="298" cy="250" rx="17" ry="22"/>
    </g>
    <g fill="#ffffff">
      <circle cx="208" cy="242" r="5.5"/>
      <circle cx="292" cy="242" r="5.5"/>
    </g>
    <!-- smile -->
    <path d="M206 296 Q256 344 306 296" fill="none" stroke="#0B2740" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- orbit moon/coin (front of ring) -->
  <g transform="rotate(-22 256 262)">
    <circle cx="452" cy="262" r="15" fill="#FCD34D" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="447" cy="257" r="4" fill="#FEF3C7"/>
  </g>

  <!-- adventure sparkles -->
  <g fill="#FDE68A">
    <path d="M392 150 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 Z"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M132 372 l5.5 13 13 5.5 -13 5.5 -5.5 13 -5.5 -13 -13 -5.5 13 -5.5 Z" opacity="0.95"/>
  </g>
</svg>
